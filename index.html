<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFTER LIGUE - Ligue Multi-Jeux 2v2</title>
    <!-- Supabase DOIT être chargé EN PREMIER -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <script>
        // Sauvegarder la référence Supabase AVANT que Babel ne s'exécute
        window.SUPABASE_SDK = window.supabase;
        console.log('✅ Supabase SDK sauvegardé:', !!window.SUPABASE_SDK);
    </script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-card-hover: #1a1a25;
            --border: #2a2a3a;
            --text-primary: #ffffff;
            --text-secondary: #8888aa;
            --text-muted: #555566;
            --accent-cyan: #00f0ff;
            --accent-violet: #a855f7;
            --accent-pink: #f472b6;
            --accent-orange: #fb923c;
            --gradient-main: linear-gradient(135deg, #00f0ff 0%, #a855f7 100%);
            --gradient-card: linear-gradient(180deg, rgba(0,240,255,0.05) 0%, transparent 100%);
            --glow-cyan: 0 0 20px rgba(0,240,255,0.3);
            --glow-violet: 0 0 20px rgba(168,85,247,0.3);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(0,240,255,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(168,85,247,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 0%, var(--bg-dark) 100%);
            pointer-events: none;
            z-index: -1;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-cyan);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes glow {
            0%, 100% { box-shadow: var(--glow-cyan); }
            50% { box-shadow: var(--glow-violet); }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .animate-fade-in {
            animation: fadeInUp 0.5s ease-out forwards;
        }

        .animate-slide-in {
            animation: slideIn 0.4s ease-out forwards;
        }

        /* Typography */
        h1, h2, h3 {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        /* Layout */
        #root {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext } = React;

        // ============================================
        // SYSTÈME DE STOCKAGE (localStorage)
        // ============================================

        const Storage = {
            get: (key, defaultValue) => {
                try {
                    const item = localStorage.getItem(`afterligue_${key}`);
                    return item ? JSON.parse(item) : defaultValue;
                } catch {
                    return defaultValue;
                }
            },
            set: (key, value) => {
                try {
                    localStorage.setItem(`afterligue_${key}`, JSON.stringify(value));
                } catch (e) {
                    console.error('Storage error:', e);
                }
            },
            remove: (key) => {
                localStorage.removeItem(`afterligue_${key}`);
            }
        };

        // ============================================
        // CONFIGURATION SUPABASE (Base de données en ligne)
        // ============================================
        const SUPABASE_URL = 'https://gxoyfllirrwsarpzmpvq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4b3lmbGxpcnJ3c2FycHptcHZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk0NDY0ODcsImV4cCI6MjA4NTAyMjQ4N30.FEnjMRm5gU2FqTujsmRmmySuYh7rPdKCbe1m753ZZBg';
        
        // Client Supabase - utiliser la référence sauvegardée
        let supabase = null;
        
        if (window.SUPABASE_SDK && window.SUPABASE_SDK.createClient) {
            supabase = window.SUPABASE_SDK.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('✅ Supabase client créé avec succès!');
        } else {
            console.warn('⚠️ SUPABASE_SDK non disponible, mode localStorage');
        }

        // ============================================
        // DONNÉES & CONTEXTE
        // ============================================

        const GAMES = [
            { id: 'rocket-league', name: 'Rocket League', emoji: '🚗', color: '#00a2ff' },
            { id: 'brawlhalla', name: 'Brawlhalla', emoji: '⚔️', color: '#ffd700' },
            { id: 'league-of-legends', name: 'League of Legends', emoji: '🏆', color: '#c89b3c' },
            { id: 'valorant', name: 'Valorant', emoji: '🎯', color: '#ff4655' },
            { id: 'fall-guys', name: 'Fall Guys', emoji: '🫘', color: '#ff69b4' },
            { id: 'trackmania', name: 'TrackMania', emoji: '🏎️', color: '#00ff00' },
            { id: 'hearthstone', name: 'Hearthstone', emoji: '🃏', color: '#ff8c00' },
            { id: '2xko', name: '2XKO', emoji: '🥊', color: '#9932cc' }
        ];

        const LEVELS = [
            { id: 'none', label: 'Ne joue pas', emoji: '❌', value: 0, color: '#444' },
            { id: 'beginner', label: 'Débutant', emoji: '🟢', value: 1, color: '#22c55e' },
            { id: 'intermediate', label: 'Intermédiaire', emoji: '🟡', value: 2, color: '#eab308' },
            { id: 'confirmed', label: 'Confirmé', emoji: '🔵', value: 3, color: '#3b82f6' },
            { id: 'tryhard', label: 'Tryhard', emoji: '🔴', value: 4, color: '#ef4444' }
        ];

        // Points par placement
        const POINTS_SYSTEM = {
            win: 10,
            lose: 3,
            draw: 5
        };

        // Données initiales - VIDE (les vraies données seront chargées depuis Supabase)
        const INITIAL_PLAYERS = [];

        const INITIAL_TEAMS = [];

        const INITIAL_SETTINGS = {
            registrationOpen: true,
            seasonName: 'Saison 1',
            adminPassword: 'admin123',
            tournamentStarted: false
        };

        // Contexte d'authentification
        const AuthContext = createContext(null);
        const useAuth = () => useContext(AuthContext);

        // Contexte des données globales
        const DataContext = createContext(null);
        const useData = () => useContext(DataContext);

        // Provider des données avec Supabase
        const DataProvider = ({ children }) => {
            const [players, setPlayers] = useState([]);
            const [teams, setTeams] = useState([]);
            const [matches, setMatches] = useState([]);
            const [settings, setSettings] = useState(INITIAL_SETTINGS);
            const [friendships, setFriendships] = useState([]);
            const [friendRequests, setFriendRequests] = useState([]);
            const [messages, setMessages] = useState([]);
            const [loading, setLoading] = useState(true);

            // Charger les données depuis Supabase au démarrage
            useEffect(() => {
                const loadData = async () => {
                    if (!supabase) {
                        // Mode localStorage si Supabase non configuré
                        setPlayers(Storage.get('players', []));
                        setTeams(Storage.get('teams', []));
                        setMatches(Storage.get('matches', []));
                        setSettings(Storage.get('settings', INITIAL_SETTINGS));
                        setFriendships(Storage.get('friendships', []));
                        setFriendRequests(Storage.get('friendRequests', []));
                        setMessages(Storage.get('messages', []));
                        setLoading(false);
                        return;
                    }

                    try {
                        // Charger depuis Supabase
                        const [playersRes, teamsRes, matchesRes, settingsRes, friendshipsRes, requestsRes, messagesRes] = await Promise.all([
                            supabase.from('players').select('*').order('created_at', { ascending: false }),
                            supabase.from('teams').select('*').order('created_at', { ascending: false }),
                            supabase.from('matches').select('*').order('date', { ascending: false }),
                            supabase.from('settings').select('*').single(),
                            supabase.from('friendships').select('*'),
                            supabase.from('friend_requests').select('*'),
                            supabase.from('messages').select('*').order('created_at', { ascending: true })
                        ]);

                        // Transformer les données Supabase vers le format de l'app
                        if (playersRes.data) setPlayers(playersRes.data.map(p => ({
                            id: p.id,
                            discordName: p.discord_name,
                            discordId: p.discord_id,
                            avatarUrl: p.avatar_url,
                            status: p.status || 'solo',
                            partner: p.partner,
                            availability: p.availability,
                            levels: p.levels || {}
                        })));

                        if (teamsRes.data) setTeams(teamsRes.data.map(t => ({
                            id: t.id,
                            name: t.name,
                            image: t.image_url,
                            players: t.players || [],
                            active: t.active,
                            points: t.points || {}
                        })));

                        if (matchesRes.data) setMatches(matchesRes.data.map(m => ({
                            id: m.id,
                            team1Id: m.team1_id,
                            team2Id: m.team2_id,
                            gameId: m.game_id,
                            winner: m.winner,
                            declaredBy: m.declared_by,
                            date: m.date
                        })));

                        if (settingsRes.data) setSettings({
                            registrationOpen: settingsRes.data.registration_open,
                            seasonName: settingsRes.data.season_name,
                            tournamentStarted: settingsRes.data.tournament_started,
                            adminPassword: settingsRes.data.admin_password
                        });

                        if (friendshipsRes.data) setFriendships(friendshipsRes.data.map(f => ({
                            id: f.id,
                            user1: f.user1,
                            user2: f.user2,
                            date: f.created_at
                        })));

                        if (requestsRes.data) setFriendRequests(requestsRes.data.map(r => ({
                            id: r.id,
                            from: r.from_user,
                            to: r.to_user,
                            date: r.created_at
                        })));

                        if (messagesRes.data) setMessages(messagesRes.data.map(m => ({
                            id: m.id,
                            from: m.from_user,
                            to: m.to_user,
                            content: m.content,
                            read: m.read,
                            date: m.created_at
                        })));

                        console.log('✅ Données chargées depuis Supabase');
                    } catch (error) {
                        console.error('Erreur chargement Supabase:', error);
                    }
                    setLoading(false);
                };

                loadData();

                // Écouter les changements en temps réel
                if (supabase) {
                    const channel = supabase.channel('realtime-all')
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'players' }, () => loadData())
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'teams' }, () => loadData())
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'matches' }, () => loadData())
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => loadData())
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'friendships' }, () => loadData())
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'friend_requests' }, () => loadData())
                        .subscribe();

                    return () => supabase.removeChannel(channel);
                }
            }, []);

            // Sauvegarder dans localStorage comme backup
            useEffect(() => { Storage.set('players', players); }, [players]);
            useEffect(() => { Storage.set('teams', teams); }, [teams]);
            useEffect(() => { Storage.set('matches', matches); }, [matches]);
            useEffect(() => { Storage.set('settings', settings); }, [settings]);

            // Fonctions pour manipuler les données
            const addTeam = async (team) => {
                if (supabase) {
                    const { data, error } = await supabase.from('teams').insert({
                        name: team.name,
                        image_url: team.image,
                        players: team.players,
                        active: true,
                        points: team.points || {}
                    }).select().single();
                    if (data) setTeams(prev => [{ ...team, id: data.id }, ...prev]);
                } else {
                    setTeams(prev => [team, ...prev]);
                }
            };

            const updateTeam = async (teamId, updates) => {
                if (supabase) {
                    await supabase.from('teams').update({
                        name: updates.name,
                        image_url: updates.image,
                        players: updates.players,
                        active: updates.active,
                        points: updates.points
                    }).eq('id', teamId);
                }
                setTeams(prev => prev.map(t => t.id === teamId ? { ...t, ...updates } : t));
            };

            const deleteTeam = async (teamId) => {
                if (supabase) {
                    await supabase.from('teams').delete().eq('id', teamId);
                }
                setTeams(prev => prev.filter(t => t.id !== teamId));
            };

            const addPlayer = async (player) => {
                if (supabase) {
                    const { data, error } = await supabase.from('players').insert({
                        discord_name: player.discordName,
                        discord_id: player.discordId,
                        avatar_url: player.avatarUrl,
                        status: player.status || 'solo',
                        partner: player.partner,
                        availability: player.availability,
                        levels: player.levels || {}
                    }).select().single();
                    if (data) setPlayers(prev => [{ ...player, id: data.id }, ...prev]);
                } else {
                    setPlayers(prev => [player, ...prev]);
                }
            };

            const updatePlayer = async (playerId, updates) => {
                if (supabase) {
                    await supabase.from('players').update({
                        discord_name: updates.discordName,
                        status: updates.status,
                        partner: updates.partner,
                        availability: updates.availability,
                        levels: updates.levels
                    }).eq('id', playerId);
                }
                setPlayers(prev => prev.map(p => p.id === playerId ? { ...p, ...updates } : p));
            };

            const updatePlayerByDiscord = async (discordName, updates) => {
                if (supabase) {
                    await supabase.from('players').update({
                        status: updates.status,
                        partner: updates.partner,
                        availability: updates.availability,
                        levels: updates.levels
                    }).eq('discord_name', discordName);
                }
                setPlayers(prev => prev.map(p => p.discordName === discordName ? { ...p, ...updates } : p));
            };

            const deletePlayer = async (playerId) => {
                if (supabase) {
                    await supabase.from('players').delete().eq('id', playerId);
                }
                setPlayers(prev => prev.filter(p => p.id !== playerId));
            };

            const addMatch = async (match) => {
                const newMatch = {
                    ...match,
                    id: Date.now().toString(),
                    date: new Date().toISOString()
                };

                if (supabase) {
                    const { data } = await supabase.from('matches').insert({
                        team1_id: match.team1Id,
                        team2_id: match.team2Id,
                        game_id: match.gameId,
                        winner: match.winner,
                        declared_by: match.declaredBy
                    }).select().single();
                    if (data) newMatch.id = data.id;
                }

                setMatches(prev => [newMatch, ...prev]);

                // Mettre à jour les points des équipes
                const { team1Id, team2Id, gameId, winner } = match;
                if (winner === 'team1') {
                    setTeams(prev => prev.map(t => {
                        if (t.id === team1Id) return { ...t, points: { ...t.points, [gameId]: (t.points[gameId] || 0) + POINTS_SYSTEM.win } };
                        if (t.id === team2Id) return { ...t, points: { ...t.points, [gameId]: (t.points[gameId] || 0) + POINTS_SYSTEM.lose } };
                        return t;
                    }));
                } else if (winner === 'team2') {
                    setTeams(prev => prev.map(t => {
                        if (t.id === team2Id) return { ...t, points: { ...t.points, [gameId]: (t.points[gameId] || 0) + POINTS_SYSTEM.win } };
                        if (t.id === team1Id) return { ...t, points: { ...t.points, [gameId]: (t.points[gameId] || 0) + POINTS_SYSTEM.lose } };
                        return t;
                    }));
                } else {
                    setTeams(prev => prev.map(t => {
                        if (t.id === team1Id || t.id === team2Id) {
                            return { ...t, points: { ...t.points, [gameId]: (t.points[gameId] || 0) + POINTS_SYSTEM.draw } };
                        }
                        return t;
                    }));
                }

                return newMatch;
            };

            // Fonctions pour les amis
            const sendFriendRequest = async (fromUser, toUser) => {
                const existingRequest = friendRequests.find(
                    r => (r.from === fromUser && r.to === toUser) || (r.from === toUser && r.to === fromUser)
                );
                if (existingRequest) return false;
                
                const alreadyFriends = friendships.some(
                    f => (f.user1 === fromUser && f.user2 === toUser) || (f.user1 === toUser && f.user2 === fromUser)
                );
                if (alreadyFriends) return false;

                const newRequest = {
                    id: Date.now().toString(),
                    from: fromUser,
                    to: toUser,
                    date: new Date().toISOString()
                };

                if (supabase) {
                    const { data } = await supabase.from('friend_requests').insert({
                        from_user: fromUser,
                        to_user: toUser
                    }).select().single();
                    if (data) newRequest.id = data.id;
                }

                setFriendRequests(prev => [...prev, newRequest]);
                return true;
            };

            const acceptFriendRequest = async (requestId) => {
                const request = friendRequests.find(r => r.id === requestId);
                if (!request) return;

                const newFriendship = {
                    id: Date.now().toString(),
                    user1: request.from,
                    user2: request.to,
                    date: new Date().toISOString()
                };

                if (supabase) {
                    const { data } = await supabase.from('friendships').insert({
                        user1: request.from,
                        user2: request.to
                    }).select().single();
                    if (data) newFriendship.id = data.id;
                    
                    await supabase.from('friend_requests').delete().eq('id', requestId);
                }

                setFriendships(prev => [...prev, newFriendship]);
                setFriendRequests(prev => prev.filter(r => r.id !== requestId));
            };

            const declineFriendRequest = async (requestId) => {
                if (supabase) {
                    await supabase.from('friend_requests').delete().eq('id', requestId);
                }
                setFriendRequests(prev => prev.filter(r => r.id !== requestId));
            };

            const removeFriend = async (user1, user2) => {
                if (supabase) {
                    await supabase.from('friendships').delete()
                        .or(`and(user1.eq.${user1},user2.eq.${user2}),and(user1.eq.${user2},user2.eq.${user1})`);
                }
                setFriendships(prev => prev.filter(
                    f => !((f.user1 === user1 && f.user2 === user2) || (f.user1 === user2 && f.user2 === user1))
                ));
            };

            const getFriends = (username) => {
                return friendships
                    .filter(f => f.user1 === username || f.user2 === username)
                    .map(f => f.user1 === username ? f.user2 : f.user1);
            };

            const areFriends = (user1, user2) => {
                return friendships.some(
                    f => (f.user1 === user1 && f.user2 === user2) || (f.user1 === user2 && f.user2 === user1)
                );
            };

            const hasPendingRequest = (fromUser, toUser) => {
                return friendRequests.some(r => r.from === fromUser && r.to === toUser);
            };

            const getPendingRequestsFor = (username) => {
                return friendRequests.filter(r => r.to === username);
            };

            // Fonctions pour les messages
            const sendMessage = async (fromUser, toUser, content) => {
                const newMessage = {
                    id: Date.now().toString(),
                    from: fromUser,
                    to: toUser,
                    content: content,
                    date: new Date().toISOString(),
                    read: false
                };

                if (supabase) {
                    const { data } = await supabase.from('messages').insert({
                        from_user: fromUser,
                        to_user: toUser,
                        content: content,
                        read: false
                    }).select().single();
                    if (data) newMessage.id = data.id;
                }

                setMessages(prev => [...prev, newMessage]);
                return newMessage;
            };

            const getConversation = (user1, user2) => {
                return messages
                    .filter(m => 
                        (m.from === user1 && m.to === user2) || 
                        (m.from === user2 && m.to === user1)
                    )
                    .sort((a, b) => new Date(a.date) - new Date(b.date));
            };

            const getConversations = (username) => {
                const userMessages = messages.filter(m => m.from === username || m.to === username);
                const partners = [...new Set(userMessages.map(m => m.from === username ? m.to : m.from))];
                return partners.map(partner => {
                    const conversation = getConversation(username, partner);
                    const lastMessage = conversation[conversation.length - 1];
                    const unreadCount = conversation.filter(m => m.to === username && !m.read).length;
                    return { partner, lastMessage, unreadCount };
                }).sort((a, b) => new Date(b.lastMessage?.date || 0) - new Date(a.lastMessage?.date || 0));
            };

            const markMessagesAsRead = async (fromUser, toUser) => {
                if (supabase) {
                    await supabase.from('messages')
                        .update({ read: true })
                        .eq('from_user', fromUser)
                        .eq('to_user', toUser)
                        .eq('read', false);
                }
                setMessages(prev => prev.map(m => 
                    m.from === fromUser && m.to === toUser && !m.read
                        ? { ...m, read: true }
                        : m
                ));
            };

            const getUnreadCount = (username) => {
                return messages.filter(m => m.to === username && !m.read).length;
            };

            const updateSettings = async (newSettings) => {
                if (supabase) {
                    await supabase.from('settings').update({
                        registration_open: newSettings.registrationOpen,
                        season_name: newSettings.seasonName,
                        tournament_started: newSettings.tournamentStarted,
                        admin_password: newSettings.adminPassword
                    }).eq('id', 1);
                }
                setSettings(prev => ({ ...prev, ...newSettings }));
            };

            const resetAllData = async () => {
                if (supabase) {
                    await Promise.all([
                        supabase.from('players').delete().neq('id', '00000000-0000-0000-0000-000000000000'),
                        supabase.from('teams').delete().neq('id', '00000000-0000-0000-0000-000000000000'),

        const NotificationsPage = ({ setCurrentPage }) => {
            const { user } = useAuth();
            const { teams, addTeam, updateTeam } = useData();
            const [invitations, setInvitations] = useState([]);
            const [loading, setLoading] = useState(true);

            // Charger les invitations depuis Supabase
            useEffect(() => {
                const loadInvitations = async () => {
                    if (!user || !supabase) {
                        setLoading(false);
                        return;
                    }
                    
                    const { data, error } = await supabase
                        .from('team_invitations')
                        .select('*')
                        .eq('to_player', user.discordName)
                        .eq('status', 'pending')
                        .order('created_at', { ascending: false });
                    
                    if (data) {
                        setInvitations(data.map(inv => ({
                            id: inv.id,
                            type: 'team_invite',
                            from: inv.from_player,
                            teamName: inv.team_name,
                            message: 'veut créer une équipe avec toi',
                            time: new Date(inv.created_at).toLocaleString('fr-FR'),
                            read: false
                        })));
                    }
                    setLoading(false);
                };
                
                loadInvitations();
                
                // Écouter les nouvelles invitations en temps réel
                if (supabase && user) {
                    const channel = supabase.channel('invitations')
                        .on('postgres_changes', { 
                            event: '*', 
                            schema: 'public', 
                            table: 'team_invitations',
                            filter: `to_player=eq.${user.discordName}`
                        }, () => loadInvitations())
                        .subscribe();
                    
                    return () => supabase.removeChannel(channel);
                }
            }, [user]);

            const handleAccept = async (invitationId) => {
                const invitation = invitations.find(i => i.id === invitationId);
                if (!invitation || !supabase) return;
                
                try {
                    // Créer l'équipe directement dans Supabase
                    const teamName = invitation.teamName || `Équipe ${invitation.from.split('#')[0]}`;
                    const { data: newTeamData, error: teamError } = await supabase.from('teams').insert({
                        name: teamName,
                        image_url: `https://api.dicebear.com/7.x/shapes/svg?seed=${Date.now()}&backgroundColor=0f0f17`,
                        players: [invitation.from, user.discordName],
                        active: true,
                        points: { 'rocket-league': 0, 'brawlhalla': 0, 'league-of-legends': 0, 'valorant': 0, 'fall-guys': 0, 'trackmania': 0, 'hearthstone': 0, '2xko': 0 }
                    }).select().single();
                    
                    if (teamError) {
                        console.error('Erreur création équipe:', teamError);
                        alert('Erreur lors de la création de l\'équipe');
                        return;
                    }
                    
                    console.log('✅ Équipe créée:', newTeamData);
                    
                    // Mettre à jour le statut de l'invitation
                    await supabase.from('team_invitations')
                        .update({ status: 'accepted' })
                        .eq('id', invitationId);
                    
                    // Mettre à jour le statut des deux joueurs
                    await supabase.from('players')
                        .update({ status: 'duo', partner: user.discordName })
                        .eq('discord_name', invitation.from);
                    
                    await supabase.from('players')
                        .update({ status: 'duo', partner: invitation.from })
                        .eq('discord_name', user.discordName);
                    
                    setInvitations(prev => prev.filter(i => i.id !== invitationId));
                    alert(`Équipe "${teamName}" créée avec succès ! 🎉`);
                    
                    // Recharger la page pour voir les changements
                    window.location.reload();
                    
                } catch (error) {
                    console.error('Erreur:', error);
                    alert('Une erreur est survenue');
                }
            };

            const handleDecline = async (invitationId) => {
                if (!supabase) return;
                
                await supabase.from('team_invitations')
                    .update({ status: 'declined' })
                    .eq('id', invitationId);
                
                setInvitations(prev => prev.filter(i => i.id !== invitationId));
            };

            const getNotificationIcon = (type) => {

            const currentConversation = selectedConversation

            const handleSendMessage = () => {
                if (!messageText.trim() || !selectedConversation) return;
                sendMessage(user.discordName, selectedConversation, messageText.trim());

            const handleSelectConversation = (partner) => {

                markMessagesAsRead(partner, user.discordName);

            const handlePlayerClick = (playerName) => {
                const player = players.find(p => p.discordName === playerName);

            const totalUnread = conversations.reduce((acc, c) => acc + c.unreadCount, 0);

            return (

                    <div style={{ display: 'flex', gap: '8px', marginBottom: '24px' }} className="animate-fade-in">

                                fontSize: '14px',
                                position: 'relative'
                            }}
                        >
                            💬 Messages
                            {totalUnread > 0 && (
                                <span style={{
                                    position: 'absolute',
                                    top: '-8px',
                                    right: '-8px',
                                    background: 'var(--accent-pink)',
                                    color: 'white',

                                    fontWeight: 700,

        // Composant SplashScreen avec explosion cyberpunk
        const SplashScreen = ({ onEnter }) => {
            const [exploding, setExploding] = useState(false);
            const [particles, setParticles] = useState([]);

            const handleClick = () => {
                if (exploding) return;
                setExploding(true);
                
                // Créer des particules pour l'explosion
                const newParticles = [];
                for (let i = 0; i < 60; i++) {
                    const angle = (Math.PI * 2 * i) / 60 + Math.random() * 0.5;
                    const velocity = 8 + Math.random() * 15;
                    const size = 4 + Math.random() * 12;
                    const isCyan = Math.random() > 0.5;
                    newParticles.push({
                        id: i,
                        x: 0,
                        y: 0,
                        vx: Math.cos(angle) * velocity,
                        vy: Math.sin(angle) * velocity,
                        size,
                        color: isCyan ? '#00f0ff' : '#a855f7',
                        opacity: 1,
                        rotation: Math.random() * 360,
                        type: Math.random() > 0.7 ? 'square' : 'circle'
                    });
                }
                // Ajouter des lignes de glitch
                for (let i = 0; i < 20; i++) {
                    newParticles.push({
                        id: 60 + i,
                        x: 0,
                        y: 0,
                        vx: (Math.random() - 0.5) * 30,
                        vy: (Math.random() - 0.5) * 30,
                        size: 2 + Math.random() * 3,
                        width: 50 + Math.random() * 100,
                        color: Math.random() > 0.5 ? '#00f0ff' : '#ff00ff',
                        opacity: 1,
                        rotation: Math.random() * 360,
                        type: 'line'
                    });
                }
                setParticles(newParticles);

                // Transition vers l'accueil après l'animation
                setTimeout(() => {
                    onEnter();
                }, 1200);
            };

            // Animation des particules
            useEffect(() => {
                if (!exploding || particles.length === 0) return;

                const interval = setInterval(() => {
                    setParticles(prev => prev.map(p => ({
                        ...p,
                        x: p.x + p.vx,
                        y: p.y + p.vy,
                        vx: p.vx * 0.96,
                        vy: p.vy * 0.96,
                        opacity: p.opacity * 0.92,
                        rotation: p.rotation + (p.type === 'square' ? 15 : 0)
                    })).filter(p => p.opacity > 0.05));
                }, 16);

                return () => clearInterval(interval);
            }, [exploding, particles.length]);

            return (
                <div style={{
                    position: 'fixed',
                    top: 0,
                    left: 0,
                    width: '100vw',
                    height: '100vh',
                    background: 'var(--bg-dark)',
                    display: 'flex',
                    flexDirection: 'column',
                    alignItems: 'center',
                    justifyContent: 'center',
                    zIndex: 9999,
                    overflow: 'hidden',
                    opacity: exploding ? 0 : 1,
                    transition: 'opacity 0.5s ease-out',
                    transitionDelay: '0.7s'
                }}>
                    {/* Fond animé avec grid cyberpunk */}
                    <div style={{
                        position: 'absolute',
                        top: 0,
                        left: 0,
                        right: 0,
                        bottom: 0,
                        background: `
                            linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px),
                            linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px)
                        `,
                        backgroundSize: '50px 50px',
                        animation: 'gridMove 20s linear infinite'
                    }} />

                    {/* Cercles de glow en arrière-plan */}
                    <div style={{
                        position: 'absolute',
                        width: '600px',
                        height: '600px',
                        borderRadius: '50%',
                        background: 'radial-gradient(circle, rgba(0,240,255,0.15) 0%, transparent 70%)',
                        animation: 'pulse 3s ease-in-out infinite'
                    }} />
                    <div style={{
                        position: 'absolute',
                        width: '400px',
                        height: '400px',
                        borderRadius: '50%',
                        background: 'radial-gradient(circle, rgba(168,85,247,0.2) 0%, transparent 70%)',
                        animation: 'pulse 3s ease-in-out infinite 0.5s'
                    }} />

                    {/* Container du logo cliquable */}
                    <div 
                        onClick={handleClick}
                        style={{
                            position: 'relative',
                            cursor: 'pointer',
                            transform: exploding ? 'scale(1.5)' : 'scale(1)',
                            transition: 'transform 0.3s ease-out',
                            zIndex: 10
                        }}
                    >
                        {/* Logo */}
                        <img 
                            src="logo-after-ligue.svg" 
                            alt="After Ligue" 
                            style={{
                                width: '280px',
                                height: 'auto',
                                filter: `drop-shadow(0 0 30px rgba(0,240,255,0.6)) drop-shadow(0 0 60px rgba(168,85,247,0.4))`,
                                animation: exploding ? 'none' : 'float 3s ease-in-out infinite',
                                opacity: exploding ? 0 : 1,
                                transition: 'opacity 0.2s ease-out'
                            }}
                        />

                        {/* Particules d'explosion */}
                        {particles.map(p => (
                            <div
                                key={p.id}
                                style={{
                                    position: 'absolute',
                                    left: '50%',
                                    top: '50%',
                                    transform: `translate(${p.x}px, ${p.y}px) rotate(${p.rotation}deg)`,
                                    opacity: p.opacity,
                                    pointerEvents: 'none'
                                }}
                            >
                                {p.type === 'circle' && (
                                    <div style={{
                                        width: p.size,
                                        height: p.size,
                                        borderRadius: '50%',
                                        background: p.color,
                                        boxShadow: `0 0 ${p.size * 2}px ${p.color}`
                                    }} />
                                )}
                                {p.type === 'square' && (
                                    <div style={{
                                        width: p.size,
                                        height: p.size,
                                        background: p.color,
                                        boxShadow: `0 0 ${p.size}px ${p.color}`
                                    }} />
                                )}
                                {p.type === 'line' && (
                                    <div style={{
                                        width: p.width,
                                        height: p.size,
                                        background: `linear-gradient(90deg, transparent, ${p.color}, transparent)`,
                                        boxShadow: `0 0 10px ${p.color}`
                                    }} />
                                )}
                            </div>
                        ))}

                        {/* Onde de choc */}
                        {exploding && (
                            <>
                                <div style={{
                                    position: 'absolute',
                                    left: '50%',
                                    top: '50%',
                                    transform: 'translate(-50%, -50%)',
                                    width: '10px',
                                    height: '10px',
                                    borderRadius: '50%',
                                    border: '3px solid #00f0ff',
                                    animation: 'shockwave 0.8s ease-out forwards'
                                }} />
                                <div style={{
                                    position: 'absolute',
                                    left: '50%',
                                    top: '50%',
                                    transform: 'translate(-50%, -50%)',
                                    width: '10px',
                                    height: '10px',
                                    borderRadius: '50%',
                                    border: '3px solid #a855f7',
                                    animation: 'shockwave 0.8s ease-out forwards 0.1s'
                                }} />
                            </>
                        )}
                    </div>

                    {/* Texte d'instruction */}
                    <div style={{
                        marginTop: '40px',
                        fontFamily: "'Rajdhani', sans-serif",
                        fontSize: '18px',
                        color: 'var(--text-muted)',
                        animation: 'blink 2s ease-in-out infinite',
                        opacity: exploding ? 0 : 1,
                        transition: 'opacity 0.2s ease-out',
                        textTransform: 'uppercase',
                        letterSpacing: '0.3em'
                    }}>
                        Clique pour entrer
                    </div>

                    {/* Flash blanc lors de l'explosion */}
                    {exploding && (
                        <div style={{
                            position: 'absolute',
                            top: 0,
                            left: 0,
                            right: 0,
                            bottom: 0,
                            background: 'white',
                            animation: 'flash 0.5s ease-out forwards',
                            pointerEvents: 'none'
                        }} />
                    )}

                    {/* Styles d'animation */}
                    <style>{`
                        @keyframes float {
                            0%, 100% { transform: translateY(0); }
                            50% { transform: translateY(-15px); }
                        }
                        @keyframes pulse {
                            0%, 100% { transform: scale(1); opacity: 0.5; }
                            50% { transform: scale(1.1); opacity: 0.8; }
                        }
                        @keyframes blink {
                            0%, 100% { opacity: 0.4; }
                            50% { opacity: 1; }
                        }
                        @keyframes shockwave {
                            0% { width: 10px; height: 10px; opacity: 1; }
                            100% { width: 800px; height: 800px; opacity: 0; }
                        }
                        @keyframes flash {
                            0% { opacity: 0; }
                            20% { opacity: 0.8; }
                            100% { opacity: 0; }
                        }
                        @keyframes gridMove {
                            0% { transform: translate(0, 0); }
                            100% { transform: translate(50px, 50px); }
                        }
                    `}</style>
                </div>
            );
        };

        const App = () => {
            const [showSplash, setShowSplash] = useState(() => {
                // Ne montrer le splash que si on n'a pas encore visité
                return !Storage.get('hasVisited', false);
            });
            const [currentPage, setCurrentPage] = useState('home');
            const [user, setUser] = useState(null);
            const [selectedPlayer, setSelectedPlayer] = useState(null);

            const handleEnterSite = () => {
                setShowSplash(false);
                Storage.set('hasVisited', true);
            };

            const login = async (userData) => {
                const newUser = {
                    ...userData,
                    status: 'solo',
                    partner: '',
                    availability: '',
                    levels: GAMES.reduce((acc, game) => ({ ...acc, [game.id]: 0 }), {}),
                    isAdmin: false
                };
                
                // Sauvegarder dans Supabase
                if (supabase) {
                    try {
                        // Vérifier si le joueur existe déjà
                        const { data: existingPlayer } = await supabase
                            .from('players')
                            .select('*')
                            .eq('discord_name', userData.discordName)
                            .single();
                        
                        if (existingPlayer) {
                            // Joueur existe déjà, récupérer ses données
                            newUser.id = existingPlayer.id;
                            newUser.status = existingPlayer.status || 'solo';
                            newUser.partner = existingPlayer.partner || '';
                            newUser.availability = existingPlayer.availability || '';
                            newUser.levels = existingPlayer.levels || {};
                            console.log('✅ Joueur existant récupéré:', userData.discordName);
                        } else {
                            // Nouveau joueur, l'ajouter
                            const { data, error } = await supabase.from('players').insert({
                                discord_name: userData.discordName,
                                discord_id: userData.discordId || null,
                                avatar_url: userData.avatar || null,
                                status: 'solo',
                                partner: null,
                                availability: '',
                                levels: GAMES.reduce((acc, game) => ({ ...acc, [game.id]: 0 }), {})
                            }).select().single();
                            
                            if (data) {
                                newUser.id = data.id;
                                console.log('✅ Nouveau joueur créé:', userData.discordName);
                            }
                            if (error) {
                                console.error('Erreur création joueur:', error);
                            }
                        }
                    } catch (error) {
                        console.error('Erreur Supabase login:', error);
                    }
                }
                
                setUser(newUser);
                Storage.set('currentUser', userData);
            };

            const logout = () => {
                setUser(null);
                setCurrentPage('home');
                Storage.remove('currentUser');
            };

            const updateUser = (updates) => {
                setUser(prev => ({ ...prev, ...updates }));
            };

            // Récupérer l'utilisateur au chargement
            useEffect(() => {
                const loadUser = async () => {
                    const savedUser = Storage.get('currentUser', null);
                    if (savedUser) {
                        // Recharger depuis Supabase si disponible
                        if (supabase) {
                            const { data } = await supabase
                                .from('players')
                                .select('*')
                                .eq('discord_name', savedUser.discordName)
                                .single();
                            
                            if (data) {
                                setUser({
                                    ...savedUser,
                                    id: data.id,
                                    status: data.status || 'solo',
                                    partner: data.partner || '',
                                    availability: data.availability || '',
                                    levels: data.levels || GAMES.reduce((acc, game) => ({ ...acc, [game.id]: 0 }), {})
                                });
                                return;
                            }
                        }
                        
                        setUser({
                            ...savedUser,
                            status: 'solo',
                            partner: '',
                            availability: '',
                            levels: GAMES.reduce((acc, game) => ({ ...acc, [game.id]: 0 }), {})
                        });
                    }
                };
                loadUser();
            }, []);

            const authValue = { user, login, logout, updateUser };

            const renderPage = () => {
                switch (currentPage) {
                    case 'home':
                        return <HomePage setCurrentPage={setCurrentPage} />;
                    case 'login':
                        return <LoginPage setCurrentPage={setCurrentPage} />;
                    case 'profile':
                        return user ? <ProfilePage setCurrentPage={setCurrentPage} /> : <LoginPage setCurrentPage={setCurrentPage} />;
                    case 'notifications':
                        return user ? <NotificationsPage setCurrentPage={setCurrentPage} /> : <LoginPage setCurrentPage={setCurrentPage} />;
                    case 'messages':
                        return user ? <MessagesPage setCurrentPage={setCurrentPage} setSelectedPlayer={setSelectedPlayer} /> : <LoginPage setCurrentPage={setCurrentPage} />;
                    case 'teams':
                        return <TeamsPage setCurrentPage={setCurrentPage} setSelectedPlayer={setSelectedPlayer} />;
                    case 'matches':
                        return <MatchesPage setCurrentPage={setCurrentPage} setSelectedPlayer={setSelectedPlayer} />;
                    case 'rankings':
                        return <RankingsPage setCurrentPage={setCurrentPage} setSelectedPlayer={setSelectedPlayer} />;
                    case 'rules':
                        return <RulesPage />;
                    case 'admin':
                        return <AdminPage setCurrentPage={setCurrentPage} />;
                    case 'player-profile':
                        return <PlayerProfilePage player={selectedPlayer} setCurrentPage={setCurrentPage} />;
                    default:
                        return <HomePage setCurrentPage={setCurrentPage} />;
                }
            };

            // Afficher le splash screen
            if (showSplash) {
                return <SplashScreen onEnter={handleEnterSite} />;
            }

            return (
                <AuthContext.Provider value={authValue}>
                    <DataProvider>
                        <Header currentPage={currentPage} setCurrentPage={setCurrentPage} />
                        <main style={{ flex: 1 }}>
                            {renderPage()}
                        </main>
                        <footer style={{
                            borderTop: '1px solid var(--border)',
                            padding: '24px',
                            textAlign: 'center',
                            color: 'var(--text-muted)',
                            fontSize: '13px'
                        }}>
                            <div style={{ marginBottom: '8px' }}>
                                <span style={{
                                    fontFamily: "'Orbitron', monospace",
                                    fontWeight: 600,
                                    background: 'var(--gradient-main)',
                                    WebkitBackgroundClip: 'text',
                                    WebkitTextFillColor: 'transparent'
                                }}>
                                    AFTER LIGUE
                                </span>
                                {' '}— Ligue multi-jeux 2v2 fun
                            </div>
                            <div>
                                Made with 💜 • Version MVP
                            </div>
                        </footer>
                    </DataProvider>
                </AuthContext.Provider>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext } = React;

        // ============================================
        // SYSTÈME DE STOCKAGE (localStorage)
        // ============================================

        const Storage = {
            get: (key, defaultValue) => {
                try {
                    const item = localStorage.getItem(`afterligue_${key}`);
                    return item ? JSON.parse(item) : defaultValue;
                } catch {
                    return defaultValue;
                }
            },
            set: (key, value) => {
                try {
                    localStorage.setItem(`afterligue_${key}`, JSON.stringify(value));
                } catch (e) {
                    console.error('Storage error:', e);
                }
            },
            remove: (key) => {
                localStorage.removeItem(`afterligue_${key}`);
            }
        };

        // ============================================
        // CONFIGURATION SUPABASE (Base de données en ligne)
        // ============================================
        const SUPABASE_URL = 'https://gxoyfllirrwsarpzmpvq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4b3lmbGxpcnJ3c2FycHptcHZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk0NDY0ODcsImV4cCI6MjA4NTAyMjQ4N30.FEnjMRm5gU2FqTujsmRmmySuYh7rPdKCbe1m753ZZBg';
        
        // Client Supabase - utiliser la référence sauvegardée
        let supabase = null;
        
        if (window.SUPABASE_SDK && window.SUPABASE_SDK.createClient) {
            supabase = window.SUPABASE_SDK.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('✅ Supabase client créé avec succès!');
        } else {
            console.warn('⚠️ SUPABASE_SDK non disponible, mode localStorage');
        }

        // ============================================
        // DONNÉES & CONTEXTE
        // ============================================

        const GAMES = [
            { id: 'rocket-league', name: 'Rocket League', emoji: '🚗', color: '#00a2ff', image: 'rocket-league.jpg' },
            { id: 'brawlhalla', name: 'Brawlhalla', emoji: '⚔️', color: '#ffd700', image: 'brawlhalla.jpg' },
            { id: 'league-of-legends', name: 'League of Legends', emoji: '🏆', color: '#c89b3c', image: 'lol.jpg' },
            { id: 'valorant', name: 'Valorant', emoji: '🎯', color: '#ff4655', image: 'valorant.jpg' },
            { id: 'fall-guys', name: 'Fall Guys', emoji: '🫘', color: '#ff69b4', image: 'fall-guys.jpg' },
            { id: 'trackmania', name: 'TrackMania', emoji: '🏎️', color: '#00ff00', image: 'trackmania.jpg' },
            { id: 'hearthstone', name: 'Hearthstone', emoji: '🃏', color: '#ff8c00', image: 'hearthstone.jpg' },
            { id: '2xko', name: '2XKO', emoji: '🥊', color: '#9932cc', image: '2xko.jpg' }
        ];

        const LEVELS = [
            { id: 'none', label: '❌', emoji: '❌', value: 0, color: '#ef4444' },
            { id: '30min', label: '30min', emoji: '30min', value: 1, color: '#22c55e' },
            { id: '10h', label: '10h', emoji: '10h', value: 2, color: '#84cc16' },
            { id: '50h', label: '50h', emoji: '50h', value: 3, color: '#eab308' },
            { id: '200h', label: '200h', emoji: '200h', value: 4, color: '#f97316' },
            { id: '500h', label: '500h+', emoji: '🔥', value: 5, color: '#ef4444' }
        ];

        // Points par placement
        const POINTS_SYSTEM = {
            win: 3,
            lose: 0,
            draw: 1
        };

        // Données initiales - VIDE (les vraies données seront chargées depuis Supabase)
        const INITIAL_PLAYERS = [];

        const INITIAL_TEAMS = [];

        const INITIAL_SETTINGS = {
            registrationOpen: true,
            seasonName: 'Saison 1',
            adminPassword: 'admin123',
            tournamentStarted: false,
            countdownEnabled: true,
            countdownDate: '2025-07-01T20:00:00',
            // Planning des jeux (8 jeux x 2 semaines)
            gamePlanning: [
                { gameId: 'rocket-league', startDate: null, endDate: null },
                { gameId: 'brawlhalla', startDate: null, endDate: null },
                { gameId: 'league-of-legends', startDate: null, endDate: null },
                { gameId: 'valorant', startDate: null, endDate: null },
                { gameId: 'fall-guys', startDate: null, endDate: null },
                { gameId: 'trackmania', startDate: null, endDate: null },
                { gameId: 'hearthstone', startDate: null, endDate: null },
                { gameId: '2xko', startDate: null, endDate: null }
            ],
            // Phase finale
            finalsEnabled: false,
            finalsTeams: [], // Les 8 meilleures équipes
            finalsBracket: null // Le bracket avec les matchs BO3
        };

        // Contexte d'authentification
        const AuthContext = createContext(null);
        const useAuth = () => useContext(AuthContext);

        // Contexte des données globales
        const DataContext = createContext(null);
        const useData = () => useContext(DataContext);

        // Provider des données avec Supabase
        const DataProvider = ({ children }) => {
            const [players, setPlayers] = useState([]);
            const [teams, setTeams] = useState([]);
            const [matches, setMatches] = useState([]);
            const [settings, setSettings] = useState(INITIAL_SETTINGS);
            const [friendships, setFriendships] = useState([]);
            const [friendRequests, setFriendRequests] = useState([]);
            const [messages, setMessages] = useState([]);
            const [loading, setLoading] = useState(true);

            // Charger les données depuis Supabase au démarrage
            useEffect(() => {
                const loadData = async () => {
                    if (!supabase) {
                        // Mode localStorage si Supabase non configuré
                        setPlayers(Storage.get('players', []));
                        setTeams(Storage.get('teams', []));
                        setMatches(Storage.get('matches', []));
                        setSettings(Storage.get('settings', INITIAL_SETTINGS));
                        setFriendships(Storage.get('friendships', []));
                        setFriendRequests(Storage.get('friendRequests', []));
                        setMessages(Storage.get('messages', []));
                        setLoading(false);
                        return;
                    }

                    try {
                        // Charger depuis Supabase
                        const [playersRes, teamsRes, matchesRes, settingsRes, friendshipsRes, requestsRes, messagesRes] = await Promise.all([
                            supabase.from('players').select('*').order('created_at', { ascending: false }),
                            supabase.from('teams').select('*').order('created_at', { ascending: false }),
                            supabase.from('matches').select('*').order('date', { ascending: false }),
                            supabase.from('settings').select('*').single(),
                            supabase.from('friendships').select('*'),
                            supabase.from('friend_requests').select('*'),
                            supabase.from('messages').select('*').order('created_at', { ascending: true })
                        ]);

                        // Transformer les données Supabase vers le format de l'app
                        if (playersRes.data) setPlayers(playersRes.data.map(p => ({
                            id: p.id,
                            discordName: p.discord_name,
                            discordId: p.discord_id,
                            avatarUrl: p.avatar_url,
                            status: p.status || 'solo',
                            partner: p.partner,
                            availability: p.availability,
                            levels: p.levels || {}
                        })));

                        if (teamsRes.data) setTeams(teamsRes.data.map(t => ({
                            id: t.id,
                            name: t.name,
                            image: t.image_url,
                            players: t.players || [],
                            active: t.active,
                            points: t.points || {}
                        })));

                        if (matchesRes.data) setMatches(matchesRes.data.map(m => ({
                            id: m.id,
                            team1Id: m.team1_id,
                            team2Id: m.team2_id,
                            gameId: m.game_id,
                            winner: m.winner,
                            declaredBy: m.declared_by,
                            date: m.date
                        })));

                        if (settingsRes.data) setSettings({
                            registrationOpen: settingsRes.data.registration_open,
                            seasonName: settingsRes.data.season_name,
                            tournamentStarted: settingsRes.data.tournament_started,
                            adminPassword: settingsRes.data.admin_password,
                            countdownEnabled: settingsRes.data.countdown_enabled !== false,
                            countdownDate: settingsRes.data.countdown_date || '2025-07-01T20:00:00',
                            gamePlanning: settingsRes.data.game_planning || INITIAL_SETTINGS.gamePlanning,
                            finalsEnabled: settingsRes.data.finals_enabled || false,
                            finalsTeams: settingsRes.data.finals_teams || [],
                            finalsBracket: settingsRes.data.finals_bracket || null
                        });

                        if (friendshipsRes.data) setFriendships(friendshipsRes.data.map(f => ({
                            id: f.id,
                            user1: f.user1,
                            user2: f.user2,
                            date: f.created_at
                        })));

                        if (requestsRes.data) setFriendRequests(requestsRes.data.map(r => ({
                            id: r.id,
                            from: r.from_user,
                            to: r.to_user,
                            date: r.created_at
                        })));

                        if (messagesRes.data) setMessages(messagesRes.data.map(m => ({
                            id: m.id,
                            from: m.from_user,
                            to: m.to_user,
                            content: m.content,
                            read: m.read,
                            date: m.created_at
                        })));

                        console.log('✅ Données chargées depuis Supabase');
                    } catch (error) {
                        console.error('Erreur chargement Supabase:', error);
                    }
                    setLoading(false);
                };

                loadData();

                // Écouter les changements en temps réel
                if (supabase) {
                    const channel = supabase.channel('realtime-all')
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'players' }, () => loadData())
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'teams' }, () => loadData())
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'matches' }, () => loadData())
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => loadData())
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'friendships' }, () => loadData())
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'friend_requests' }, () => loadData())
                        .subscribe();

                    return () => supabase.removeChannel(channel);
                }
            }, []);

            // Sauvegarder dans localStorage comme backup
            useEffect(() => { Storage.set('players', players); }, [players]);
            useEffect(() => { Storage.set('teams', teams); }, [teams]);
            useEffect(() => { Storage.set('matches', matches); }, [matches]);
            useEffect(() => { Storage.set('settings', settings); }, [settings]);

            // Fonctions pour manipuler les données
            const addTeam = async (team) => {
                if (supabase) {
                    const { data, error } = await supabase.from('teams').insert({
                        name: team.name,
                        image_url: team.image,
                        players: team.players,
                        active: true,
                        points: team.points || {}
                    }).select().single();
                    if (data) setTeams(prev => [{ ...team, id: data.id }, ...prev]);
                } else {
                    setTeams(prev => [team, ...prev]);
                }
            };

            const updateTeam = async (teamId, updates) => {
                if (supabase) {
                    await supabase.from('teams').update({
                        name: updates.name,
                        image_url: updates.image,
                        players: updates.players,
                        active: updates.active,
                        points: updates.points
                    }).eq('id', teamId);
                }
                setTeams(prev => prev.map(t => t.id === teamId ? { ...t, ...updates } : t));
            };

            const deleteTeam = async (teamId) => {
                // Supprimer localement d'abord pour un feedback immédiat
                setTeams(prev => prev.filter(t => t.id !== teamId));
                
                if (supabase) {
                    try {
                        // Supprimer aussi les matchs liés à cette équipe
                        await supabase.from('matches').delete().or(`team1_id.eq.${teamId},team2_id.eq.${teamId}`);
                        // Supprimer l'équipe
                        const { error } = await supabase.from('teams').delete().eq('id', teamId);
                        if (error) {
                            console.error('Erreur suppression équipe:', error);
                        } else {
                            console.log('✅ Équipe supprimée:', teamId);
                        }
                    } catch (err) {
                        console.error('Erreur:', err);
                    }
                }
            };

            const addPlayer = async (player) => {
                if (supabase) {
                    const { data, error } = await supabase.from('players').insert({
                        discord_name: player.discordName,
                        discord_id: player.discordId,
                        avatar_url: player.avatarUrl,
                        status: player.status || 'solo',
                        partner: player.partner,
                        availability: player.availability,
                        levels: player.levels || {}
                    }).select().single();
                    if (data) setPlayers(prev => [{ ...player, id: data.id }, ...prev]);
                } else {
                    setPlayers(prev => [player, ...prev]);
                }
            };

            const updatePlayer = async (playerId, updates) => {
                if (supabase) {
                    await supabase.from('players').update({
                        discord_name: updates.discordName,
                        status: updates.status,
                        partner: updates.partner,
                        availability: updates.availability,
                        levels: updates.levels,
                        avatar_url: updates.avatarUrl || updates.profileImage
                    }).eq('id', playerId);
                }
                setPlayers(prev => prev.map(p => p.id === playerId ? { ...p, ...updates } : p));
            };

            const updatePlayerByDiscord = async (discordName, updates) => {
                if (supabase) {
                    await supabase.from('players').update({
                        status: updates.status,
                        partner: updates.partner,
                        availability: updates.availability,
                        levels: updates.levels
                    }).eq('discord_name', discordName);
                }
                setPlayers(prev => prev.map(p => p.discordName === discordName ? { ...p, ...updates } : p));
            };

            const deletePlayer = async (playerId) => {
                if (supabase) {
                    await supabase.from('players').delete().eq('id', playerId);
                }
                setPlayers(prev => prev.filter(p => p.id !== playerId));
            };

            const addMatch = async (match) => {
                const newMatch = {
                    ...match,
                    id: Date.now().toString(),
                    date: new Date().toISOString()
                };

                if (supabase) {
                    const { data } = await supabase.from('matches').insert({
                        team1_id: match.team1Id,
                        team2_id: match.team2Id,
                        game_id: match.gameId,
                        winner: match.winner,
                        declared_by: match.declaredBy
                    }).select().single();
                    if (data) newMatch.id = data.id;
                }

                setMatches(prev => [newMatch, ...prev]);

                // Mettre à jour les points des équipes
                const { team1Id, team2Id, gameId, winner } = match;
                if (winner === 'team1') {
                    setTeams(prev => prev.map(t => {
                        if (t.id === team1Id) return { ...t, points: { ...t.points, [gameId]: (t.points[gameId] || 0) + POINTS_SYSTEM.win } };
                        if (t.id === team2Id) return { ...t, points: { ...t.points, [gameId]: (t.points[gameId] || 0) + POINTS_SYSTEM.lose } };
                        return t;
                    }));
                } else if (winner === 'team2') {
                    setTeams(prev => prev.map(t => {
                        if (t.id === team2Id) return { ...t, points: { ...t.points, [gameId]: (t.points[gameId] || 0) + POINTS_SYSTEM.win } };
                        if (t.id === team1Id) return { ...t, points: { ...t.points, [gameId]: (t.points[gameId] || 0) + POINTS_SYSTEM.lose } };
                        return t;
                    }));
                } else {
                    setTeams(prev => prev.map(t => {
                        if (t.id === team1Id || t.id === team2Id) {
                            return { ...t, points: { ...t.points, [gameId]: (t.points[gameId] || 0) + POINTS_SYSTEM.draw } };
                        }
                        return t;
                    }));
                }

                return newMatch;
            };

            // Fonctions pour les amis
            const sendFriendRequest = async (fromUser, toUser) => {
                const existingRequest = friendRequests.find(
                    r => (r.from === fromUser && r.to === toUser) || (r.from === toUser && r.to === fromUser)
                );
                if (existingRequest) return false;
                
                const alreadyFriends = friendships.some(
                    f => (f.user1 === fromUser && f.user2 === toUser) || (f.user1 === toUser && f.user2 === fromUser)
                );
                if (alreadyFriends) return false;

                const newRequest = {
                    id: Date.now().toString(),
                    from: fromUser,
                    to: toUser,
                    date: new Date().toISOString()
                };

                if (supabase) {
                    const { data } = await supabase.from('friend_requests').insert({
                        from_user: fromUser,
                        to_user: toUser
                    }).select().single();
                    if (data) newRequest.id = data.id;
                }

                setFriendRequests(prev => [...prev, newRequest]);
                return true;
            };

            const acceptFriendRequest = async (requestId) => {
                const request = friendRequests.find(r => r.id === requestId);
                if (!request) return;

                const newFriendship = {
                    id: Date.now().toString(),
                    user1: request.from,
                    user2: request.to,
                    date: new Date().toISOString()
                };

                if (supabase) {
                    const { data } = await supabase.from('friendships').insert({
                        user1: request.from,
                        user2: request.to
                    }).select().single();
                    if (data) newFriendship.id = data.id;
                    
                    await supabase.from('friend_requests').delete().eq('id', requestId);
                }

                setFriendships(prev => [...prev, newFriendship]);
                setFriendRequests(prev => prev.filter(r => r.id !== requestId));
            };

            const declineFriendRequest = async (requestId) => {
                if (supabase) {
                    await supabase.from('friend_requests').delete().eq('id', requestId);
                }
                setFriendRequests(prev => prev.filter(r => r.id !== requestId));
            };

            const removeFriend = async (user1, user2) => {
                if (supabase) {
                    await supabase.from('friendships').delete()
                        .or(`and(user1.eq.${user1},user2.eq.${user2}),and(user1.eq.${user2},user2.eq.${user1})`);
                }
                setFriendships(prev => prev.filter(
                    f => !((f.user1 === user1 && f.user2 === user2) || (f.user1 === user2 && f.user2 === user1))
                ));
            };

            const getFriends = (username) => {
                return friendships
                    .filter(f => f.user1 === username || f.user2 === username)
                    .map(f => f.user1 === username ? f.user2 : f.user1);
            };

            const areFriends = (user1, user2) => {
                return friendships.some(
                    f => (f.user1 === user1 && f.user2 === user2) || (f.user1 === user2 && f.user2 === user1)
                );
            };

            const hasPendingRequest = (fromUser, toUser) => {
                return friendRequests.some(r => r.from === fromUser && r.to === toUser);
            };

            const getPendingRequestsFor = (username) => {
                return friendRequests.filter(r => r.to === username);
            };

            // Fonctions pour les messages
            const sendMessage = async (fromUser, toUser, content) => {
                const newMessage = {
                    id: Date.now().toString(),
                    from: fromUser,
                    to: toUser,
                    content: content,
                    date: new Date().toISOString(),
                    read: false
                };

                if (supabase) {
                    const { data } = await supabase.from('messages').insert({
                        from_user: fromUser,
                        to_user: toUser,
                        content: content,
                        read: false
                    }).select().single();
                    if (data) newMessage.id = data.id;
                }

                setMessages(prev => [...prev, newMessage]);
                return newMessage;
            };

            const getConversation = (user1, user2) => {
                return messages
                    .filter(m => 
                        (m.from === user1 && m.to === user2) || 
                        (m.from === user2 && m.to === user1)
                    )
                    .sort((a, b) => new Date(a.date) - new Date(b.date));
            };

            const getConversations = (username) => {
                const userMessages = messages.filter(m => m.from === username || m.to === username);
                const partners = [...new Set(userMessages.map(m => m.from === username ? m.to : m.from))];
                return partners.map(partner => {
                    const conversation = getConversation(username, partner);
                    const lastMessage = conversation[conversation.length - 1];
                    const unreadCount = conversation.filter(m => m.to === username && !m.read).length;
                    return { partner, lastMessage, unreadCount };
                }).sort((a, b) => new Date(b.lastMessage?.date || 0) - new Date(a.lastMessage?.date || 0));
            };

            const markMessagesAsRead = async (fromUser, toUser) => {
                if (supabase) {
                    await supabase.from('messages')
                        .update({ read: true })
                        .eq('from_user', fromUser)
                        .eq('to_user', toUser)
                        .eq('read', false);
                }
                setMessages(prev => prev.map(m => 
                    m.from === fromUser && m.to === toUser && !m.read
                        ? { ...m, read: true }
                        : m
                ));
            };

            const getUnreadCount = (username) => {
                return messages.filter(m => m.to === username && !m.read).length;
            };

            const updateSettings = async (newSettings) => {
                if (supabase) {
                    await supabase.from('settings').update({
                        registration_open: newSettings.registrationOpen,
                        season_name: newSettings.seasonName,
                        tournament_started: newSettings.tournamentStarted,
                        admin_password: newSettings.adminPassword,
                        countdown_enabled: newSettings.countdownEnabled,
                        countdown_date: newSettings.countdownDate,
                        game_planning: newSettings.gamePlanning,
                        finals_enabled: newSettings.finalsEnabled,
                        finals_teams: newSettings.finalsTeams,
                        finals_bracket: newSettings.finalsBracket
                    }).eq('id', 1);
                }
                setSettings(prev => ({ ...prev, ...newSettings }));
            };

            const resetAllData = async () => {
                if (supabase) {
                    await Promise.all([
                        supabase.from('players').delete().neq('id', '00000000-0000-0000-0000-000000000000'),
                        supabase.from('teams').delete().neq('id', '00000000-0000-0000-0000-000000000000'),
                        supabase.from('matches').delete().neq('id', '00000000-0000-0000-0000-000000000000'),
                        supabase.from('friendships').delete().neq('id', '00000000-0000-0000-0000-000000000000'),
                        supabase.from('friend_requests').delete().neq('id', '00000000-0000-0000-0000-000000000000'),
                        supabase.from('messages').delete().neq('id', '00000000-0000-0000-0000-000000000000')
                    ]);
                }
                setPlayers([]);
                setTeams([]);
                setMatches([]);
                setSettings(INITIAL_SETTINGS);
                setFriendships([]);
                setFriendRequests([]);
                setMessages([]);
            };

            // Afficher un loader pendant le chargement
            if (loading) {
                return (
                    <div style={{
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        height: '100vh',
                        background: 'var(--bg-dark)'
                    }}>
                        <div style={{ textAlign: 'center' }}>
                            <div style={{ fontSize: '48px', marginBottom: '16px' }}>⚡</div>
                            <div style={{ 
                                fontFamily: "'Orbitron', monospace",
                                color: 'var(--accent-cyan)',
                                fontSize: '18px'
                            }}>
                                Chargement...
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <DataContext.Provider value={{
                    players, teams, matches, settings, friendships, friendRequests, messages,
                    addTeam, updateTeam, deleteTeam,
                    addPlayer, updatePlayer, updatePlayerByDiscord, deletePlayer,
                    addMatch, updateSettings, resetAllData,
                    sendFriendRequest, acceptFriendRequest, declineFriendRequest, removeFriend,
                    getFriends, areFriends, hasPendingRequest, getPendingRequestsFor,
                    sendMessage, getConversation, getConversations, markMessagesAsRead, getUnreadCount
                }}>
                    {children}
                </DataContext.Provider>
            );
        };

        // ============================================
        // COMPOSANTS UI
        // ============================================

        const Button = ({ children, variant = 'primary', size = 'md', onClick, disabled, className = '' }) => {
            const baseStyles = {
                display: 'inline-flex',

                gap: '8px',
                fontFamily: "'Rajdhani', sans-serif",
                fontWeight: 600,
                textTransform: 'uppercase',
                letterSpacing: '0.1em',
                border: 'none',
                borderRadius: '4px',
                cursor: disabled ? 'not-allowed' : 'pointer',
                transition: 'all 0.2s ease',
                opacity: disabled ? 0.5 : 1,
            };

            const variants = {
                primary: {
                    background: 'var(--gradient-main)',
                    color: 'var(--bg-dark)',
                    boxShadow: '0 4px 15px rgba(0,240,255,0.3)',
                },
                secondary: {
                    background: 'transparent',
                    color: 'var(--accent-cyan)',
                    border: '1px solid var(--accent-cyan)',
                },
                ghost: {

                    color: 'var(--text-secondary)',
                }

            const sizes = {

                md: { padding: '12px 24px', fontSize: '14px' },

            return (
                <button

                    style={{ ...baseStyles, ...variants[variant], ...sizes[size] }}
                    className={className}
                    onMouseEnter={(e) => {
                        if (!disabled) {
                            e.target.style.transform = 'translateY(-2px)';
                            e.target.style.boxShadow = variant === 'primary' 
                                ? '0 6px 25px rgba(0,240,255,0.5)' 
                                : '0 4px 15px rgba(0,240,255,0.2)';
                        }
                    }}
                    onMouseLeave={(e) => {
                        e.target.style.transform = 'translateY(0)';
                        e.target.style.boxShadow = variant === 'primary' 
                            ? '0 4px 15px rgba(0,240,255,0.3)' 
                            : 'none';
                    }}
                >
                    {children}
                </button>
            );
        };

        const Card = ({ children, className = '', style = {}, hover = true }) => (
            <div
                className={className}
                style={{
                    background: 'var(--bg-card)',
                    border: '1px solid var(--border)',
                    borderRadius: '8px',
                    padding: '24px',
                    position: 'relative',
                    overflow: 'hidden',
                    transition: 'all 0.3s ease',
                    ...style

                onMouseEnter={(e) => {
                    if (hover) {
                        e.currentTarget.style.borderColor = 'var(--accent-cyan)';
                        e.currentTarget.style.boxShadow = '0 0 30px rgba(0,240,255,0.1)';

                }}
                onMouseLeave={(e) => {
                    if (hover) {
                        e.currentTarget.style.borderColor = 'var(--border)';
                        e.currentTarget.style.boxShadow = 'none';
                    }
                }}
            >
                <div style={{
                    position: 'absolute',
                    top: 0,
                    left: 0,
                    right: 0,
                    height: '1px',
                    background: 'var(--gradient-main)',
                    opacity: 0.5
                }} />
                {children}
            </div>
        );

        const Badge = ({ children, color = 'var(--accent-cyan)' }) => (
            <span style={{
                display: 'inline-flex',
                alignItems: 'center',
                padding: '4px 12px',
                fontSize: '11px',
                fontWeight: 600,
                textTransform: 'uppercase',
                letterSpacing: '0.1em',
                background: `${color}22`,
                color: color,
                borderRadius: '20px',
                border: `1px solid ${color}44`
            }}>
                {children}
            </span>
        );

        const LevelBadge = ({ level }) => {
            const levelData = LEVELS.find(l => l.value === level) || LEVELS[0];
            return (
                <span style={{
                    display: 'inline-flex',
                    alignItems: 'center',
                    gap: '4px',
                    padding: '2px 8px',
                    fontSize: '12px',
                    background: `${levelData.color}22`,
                    color: levelData.color,
                    borderRadius: '4px',
                    fontWeight: 500
                }}>
                    {levelData.emoji} {levelData.label}
                </span>
            );
        };

        // Composant pour les pseudos cliquables - utilisé partout
        const ClickablePlayer = ({ name, onClick }) => {
            const [isHovered, setIsHovered] = useState(false);
            
            return (
                <button
                    type="button"
                    onClick={(e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        if (onClick) onClick(name);
                    }}
                    onMouseEnter={() => setIsHovered(true)}
                    onMouseLeave={() => setIsHovered(false)}
                    style={{
                        background: isHovered ? 'rgba(168,85,247,0.15)' : 'transparent',
                        border: 'none',
                        padding: '2px 6px',
                        borderRadius: '4px',
                        cursor: 'pointer',
                        color: isHovered ? '#a855f7' : '#00f0ff',
                        fontFamily: 'inherit',
                        fontSize: 'inherit',
                        fontWeight: 'inherit',
                        transition: 'all 0.15s ease',
                        display: 'inline-block',
                        lineHeight: 'inherit'
                    }}
                >
                    {name}
                </button>
            );
        };

        const Modal = ({ show, onClose, children, title }) => {
            if (!show) return null;
            return (
                <div style={{
                    position: 'fixed',
                    top: 0,
                    left: 0,
                    right: 0,
                    bottom: 0,
                    background: 'rgba(0,0,0,0.8)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    zIndex: 1000,
                    padding: '24px'
                }} onClick={onClose}>
                    <div 
                        style={{
                            background: 'var(--bg-card)',
                            border: '1px solid var(--border)',
                            borderRadius: '12px',

                            maxWidth: '500px',
                            width: '100%',
                            position: 'relative'
                        }}
                        onClick={(e) => e.stopPropagation()}
                        className="animate-fade-in"
                    >
                        <div style={{
                            position: 'absolute',
                            top: 0,
                            left: 0,
                            right: 0,
                            height: '2px',

                        <button
                            onClick={onClose}
                            style={{
                                position: 'absolute',
                                top: '16px',
                                right: '16px',
                                background: 'none',
                                border: 'none',
                                color: 'var(--text-muted)',
                                fontSize: '24px',
                                cursor: 'pointer'
                            }}
                        >
                            ×
                        </button>
                        <h2 style={{ fontSize: '22px', marginBottom: '24px' }}>{title}</h2>
                        {children}
                    </div>
                </div>
            );

        // ============================================
        // NAVIGATION
        // ============================================

        const Header = ({ currentPage, setCurrentPage }) => {
            const { user, logout } = useAuth();
            const { getUnreadCount, getPendingRequestsFor } = useData();
            const [menuOpen, setMenuOpen] = useState(false);
            const [invitationCount, setInvitationCount] = useState(0);

            const unreadMessages = user ? getUnreadCount(user.discordName) : 0;
            const pendingRequests = user ? getPendingRequestsFor(user.discordName).length : 0;
            const totalMessageBadge = unreadMessages + pendingRequests;

            // Charger le nombre d'invitations
            useEffect(() => {
                const loadInvitationCount = async () => {
                    if (!user || !supabase) return;
                    
                    const { data, count } = await supabase
                        .from('team_invitations')
                        .select('*', { count: 'exact' })
                        .eq('to_player', user.discordName)
                        .eq('status', 'pending');
                    
                    setInvitationCount(count || 0);
                };
                
                loadInvitationCount();
                
                // Écouter les changements en temps réel
                if (supabase && user) {
                    const channel = supabase.channel('invitation-count')
                        .on('postgres_changes', { 
                            event: '*', 
                            schema: 'public', 
                            table: 'team_invitations'
                        }, () => loadInvitationCount())
                        .subscribe();
                    
                    return () => supabase.removeChannel(channel);
                }
            }, [user]);

            const navItems = [
                { id: 'home', label: 'Accueil', icon: '🏠' },
                { id: 'teams', label: 'Équipes', icon: '👥' },

                { id: 'planning', label: 'Planning', icon: '📅' },
                { id: 'finale', label: 'Finale', icon: '🎖️' },
                { id: 'rules', label: 'Règlement', icon: '📋' },
                { id: 'admin', label: 'Admin', icon: '⚙️' }
            ];

            return (
                <header style={{
                    position: 'sticky',
                    top: 0,
                    zIndex: 100,
                    background: 'rgba(10,10,15,0.9)',
                    backdropFilter: 'blur(10px)',
                    borderBottom: '1px solid var(--border)'
                }}>
                    <div style={{
                        maxWidth: '1200px',

                        padding: '16px 24px',
                        display: 'flex',

                        justifyContent: 'space-between'
                    }}>
                        {/* Logo */}
                        <div

                            style={{ cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '12px' }}
                        >
                            <img

                                    width: 'auto',
                                    filter: 'drop-shadow(0 0 12px rgba(0,240,255,0.4))'
                                }}
                            />
                        </div>

                        {/* Navigation Desktop */}
                        <nav style={{
                            display: 'flex',
                            alignItems: 'center',
                            gap: '8px'
                        }} className="desktop-nav">
                            {navItems.map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => setCurrentPage(item.id)}
                                    style={{
                                        background: currentPage === item.id ? 'rgba(0,240,255,0.1)' : 'transparent',
                                        border: 'none',
                                        color: currentPage === item.id ? 'var(--accent-cyan)' : 'var(--text-secondary)',
                                        padding: '10px 16px',
                                        borderRadius: '6px',
                                        fontFamily: "'Rajdhani', sans-serif",
                                        fontWeight: 600,
                                        fontSize: '14px',
                                        cursor: 'pointer',
                                        transition: 'all 0.2s ease',
                                        display: 'flex',
                                        alignItems: 'center',
                                        gap: '6px',
                                        position: 'relative'
                                    }}
                                    onMouseEnter={(e) => {
                                        if (currentPage !== item.id) {
                                            e.target.style.color = 'var(--text-primary)';
                                            e.target.style.background = 'rgba(255,255,255,0.05)';
                                        }
                                    }}
                                    onMouseLeave={(e) => {
                                        if (currentPage !== item.id) {
                                            e.target.style.color = 'var(--text-secondary)';
                                            e.target.style.background = 'transparent';

                                    }}
                                >
                                    <span>{item.icon}</span>
                                    {item.label}
                                    {item.badge && (
                                        <span style={{

                                            background: 'var(--accent-pink)',

                                            fontWeight: 700,

                                            {item.badge}

                                </button>

                        </nav>

                        {/* Auth */}
                        <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                            {user ? (
                                <>
                                    {/* Cloche notifications */}
                                    <button
                                        onClick={() => setCurrentPage('notifications')}
                                        style={{
                                            position: 'relative',

                                    {/* Messages */}
                                    <button

        const Countdown = () => {
            const { settings } = useData();
            
            // Utiliser la date des settings ou la date par défaut
            const LAUNCH_DATE = new Date(settings.countdownDate || '2025-07-01T20:00:00');
            
            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
            const [isLaunched, setIsLaunched] = useState(false);
            const [showConfetti, setShowConfetti] = useState(false);
            const [confettiParticles, setConfettiParticles] = useState([]);

            useEffect(() => {
                // Si countdown désactivé, ne rien faire
                if (!settings.countdownEnabled) return;

                const calculateTimeLeft = () => {
                    const now = new Date();
                    const difference = LAUNCH_DATE - now;

                    if (difference <= 0) {
                        if (!isLaunched) {
                            setIsLaunched(true);
                            triggerConfetti();
                        }
                        return { days: 0, hours: 0, minutes: 0, seconds: 0 };
                    }

                    return {
                        days: Math.floor(difference / (1000 * 60 * 60 * 24)),
                        hours: Math.floor((difference / (1000 * 60 * 60)) % 24),
                        minutes: Math.floor((difference / (1000 * 60)) % 60),
                        seconds: Math.floor((difference / 1000) % 60)
                    };
                };

                setTimeLeft(calculateTimeLeft());
                const timer = setInterval(() => {
                    setTimeLeft(calculateTimeLeft());
                }, 1000);

                return () => clearInterval(timer);
            }, [isLaunched, settings.countdownEnabled, settings.countdownDate]);

            const triggerConfetti = () => {
                setShowConfetti(true);
                const particles = [];
                const colors = ['#00f0ff', '#a855f7', '#f472b6', '#fbbf24', '#22c55e', '#ffffff'];
                
                for (let i = 0; i < 100; i++) {
                    particles.push({
                        id: i,
                        x: Math.random() * 100,
                        y: -10,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        size: 6 + Math.random() * 8,
                        speedY: 2 + Math.random() * 4,
                        speedX: (Math.random() - 0.5) * 4,
                        rotation: Math.random() * 360,
                        rotationSpeed: (Math.random() - 0.5) * 10
                    });
                }
                setConfettiParticles(particles);

                // Animation des confettis
                const animateConfetti = () => {
                    setConfettiParticles(prev => 
                        prev.map(p => ({
                            ...p,
                            y: p.y + p.speedY,
                            x: p.x + p.speedX,
                            rotation: p.rotation + p.rotationSpeed
                        })).filter(p => p.y < 120)
                    );
                };

                const confettiInterval = setInterval(animateConfetti, 50);
                setTimeout(() => {
                    clearInterval(confettiInterval);
                    setShowConfetti(false);
                }, 5000);
            };

            const TimeBlock = ({ value, label }) => (

                    flexDirection: 'column',
                    alignItems: 'center',

                    position: 'relative',
                    overflow: 'hidden'
                }}>
                    {/* Glow effect */}
                    <div style={{
                        position: 'absolute',
                        top: 0,
                        left: '50%',
                        transform: 'translateX(-50%)',
                        width: '60%',
                        height: '2px',
                        background: 'linear-gradient(90deg, transparent, var(--accent-cyan), transparent)'
                    }} />
                    
                    <span style={{
                        fontFamily: "'Orbitron', monospace",
                        fontSize: '36px',
                        fontWeight: 800,
                        background: 'linear-gradient(135deg, #00f0ff 0%, #a855f7 100%)',
                        WebkitBackgroundClip: 'text',
                        WebkitTextFillColor: 'transparent',
                        lineHeight: 1,
                        textShadow: '0 0 30px rgba(0,240,255,0.5)'

            // Si countdown désactivé, ne rien afficher
            if (!settings.countdownEnabled) {
                return null;
            }

            // Formater la date pour l'affichage
            const formatDate = (dateStr) => {
                const date = new Date(dateStr);

                    day: 'numeric', 
                    month: 'long', 
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'

                    </div>

                        {players.filter(p => p.status === 'solo').length === 0 && (

        const NotificationsPage = ({ setCurrentPage }) => {
            const { user } = useAuth();
            const { teams, addTeam, updateTeam } = useData();
            const [invitations, setInvitations] = useState([]);
            const [loading, setLoading] = useState(true);

            // Charger les invitations depuis Supabase
            useEffect(() => {
                const loadInvitations = async () => {
                    if (!user || !supabase) {
                        setLoading(false);
                        return;
                    }
                    
                    // Charger les invitations en attente
                    const { data: pendingInvites } = await supabase
                        .from('team_invitations')
                        .select('*')
                        .eq('to_player', user.discordName)
                        .eq('status', 'pending')
                        .order('created_at', { ascending: false });
                    
                    // Charger les notifications de match
                    const { data: matchNotifs } = await supabase
                        .from('team_invitations')
                        .select('*')
                        .eq('to_player', user.discordName)
                        .eq('status', 'match_result')
                        .order('created_at', { ascending: false })
                        .limit(20);
                    
                    const allNotifications = [];
                    
                    if (pendingInvites) {
                        allNotifications.push(...pendingInvites.map(inv => ({
                            id: inv.id,
                            type: 'team_invite',
                            from: inv.from_player,
                            teamName: inv.team_name,
                            message: 'veut créer une équipe avec toi',
                            time: new Date(inv.created_at).toLocaleString('fr-FR'),
                            read: false,
                            status: inv.status
                        })));
                    }
                    
                    if (matchNotifs) {
                        allNotifications.push(...matchNotifs.map(inv => ({
                            id: inv.id,
                            type: 'match_result',
                            from: inv.from_player,
                            teamName: inv.team_name,
                            message: '',
                            time: new Date(inv.created_at).toLocaleString('fr-FR'),
                            read: true,
                            status: inv.status
                        })));
                    }
                    
                    setInvitations(allNotifications);
                    setLoading(false);
                };
                
                loadInvitations();
                
                // Écouter les nouvelles invitations en temps réel
                if (supabase && user) {
                    const channel = supabase.channel('invitations')
                        .on('postgres_changes', { 
                            event: '*', 
                            schema: 'public', 
                            table: 'team_invitations',
                            filter: `to_player=eq.${user.discordName}`
                        }, () => loadInvitations())
                        .subscribe();
                    
                    return () => supabase.removeChannel(channel);
                }
            }, [user]);

            const handleAccept = async (invitationId) => {
                const invitation = invitations.find(i => i.id === invitationId);
                if (!invitation || !supabase) return;
                
                try {
                    // Vérifier si l'inviteur a déjà une équipe
                    const { data: existingTeams } = await supabase
                        .from('teams')
                        .select('*')
                        .contains('players', [invitation.from]);
                    
                    let teamName;
                    
                    if (existingTeams && existingTeams.length > 0) {
                        // L'inviteur a déjà une équipe, ajouter le joueur
                        const existingTeam = existingTeams[0];
                        const updatedPlayers = [...(existingTeam.players || []), user.discordName];
                        
                        const { error: updateError } = await supabase
                            .from('teams')
                            .update({ players: updatedPlayers })
                            .eq('id', existingTeam.id);
                        
                        if (updateError) {
                            console.error('Erreur ajout joueur:', updateError);
                            alert('Erreur lors de l\'ajout à l\'équipe');
                            return;
                        }
                        
                        teamName = existingTeam.name;
                        console.log('✅ Joueur ajouté à l\'équipe:', existingTeam.name);
                    } else {
                        // Créer une nouvelle équipe
                        teamName = invitation.teamName || `Équipe ${invitation.from.split('#')[0]}`;
                        const { error: teamError } = await supabase.from('teams').insert({
                            name: teamName,
                            image_url: `https://api.dicebear.com/7.x/shapes/svg?seed=${Date.now()}&backgroundColor=0f0f17`,
                            players: [invitation.from, user.discordName],
                            active: true,
                            points: { 'rocket-league': 0, 'brawlhalla': 0, 'league-of-legends': 0, 'valorant': 0, 'fall-guys': 0, 'trackmania': 0, 'hearthstone': 0, '2xko': 0 }
                        });
                        
                        if (teamError) {
                            console.error('Erreur création équipe:', teamError);
                            alert('Erreur lors de la création de l\'équipe');
                            return;
                        }
                        
                        console.log('✅ Équipe créée:', teamName);
                    }
                    
                    // Mettre à jour le statut de l'invitation
                    await supabase.from('team_invitations')
                        .update({ status: 'accepted' })
                        .eq('id', invitationId);
                    
                    // Mettre à jour le statut des deux joueurs
                    await supabase.from('players')
                        .update({ status: 'duo', partner: user.discordName })
                        .eq('discord_name', invitation.from);
                    
                    await supabase.from('players')
                        .update({ status: 'duo', partner: invitation.from })
                        .eq('discord_name', user.discordName);
                    
                    setInvitations(prev => prev.filter(i => i.id !== invitationId));
                    alert(`Tu as rejoint l'équipe "${teamName}" ! 🎉`);
                    
                } catch (error) {
                    console.error('Erreur:', error);
                    alert('Une erreur est survenue');
                }
            };

            const handleDecline = async (invitationId) => {
                if (!supabase) return;
                
                await supabase.from('team_invitations')
                    .update({ status: 'declined' })
                    .eq('id', invitationId);
                
                setInvitations(prev => prev.filter(i => i.id !== invitationId));
            };

            const handleDismissMatchNotif = async (notifId) => {
                if (!supabase) return;
                
                await supabase.from('team_invitations')
                    .delete()
                    .eq('id', notifId);
                
                setInvitations(prev => prev.filter(i => i.id !== notifId));
            };

            const getNotificationIcon = (type) => {
                switch(type) {
                    case 'team_invite': return '👥';
                    case 'join_request': return '🤝';
                    case 'match_result': return '🏆';
                    case 'system': return '📢';
                    default: return '🔔';
                }
            };

            if (loading) {
                return (
                    <div style={{ padding: '40px 24px', maxWidth: '800px', margin: '0 auto', textAlign: 'center' }}>
                        <div style={{ fontSize: '48px', marginBottom: '16px' }}>⏳</div>
                        <p style={{ color: 'var(--text-secondary)' }}>Chargement...</p>
                    </div>
                );
            }

            return (
                <div style={{ padding: '40px 24px', maxWidth: '800px', margin: '0 auto' }}>
                    <div className="animate-fade-in">
                        <h1 style={{ fontSize: '32px', marginBottom: '8px' }}>
                            🔔 Notifications
                        </h1>
                        <p style={{ color: 'var(--text-secondary)', marginBottom: '32px' }}>
                            {invitations.filter(i => i.status === 'pending').length} invitation(s) en attente
                        </p>
                    </div>

                    {invitations.length === 0 ? (
                        <Card style={{ textAlign: 'center', padding: '60px 24px' }} className="animate-fade-in">
                            <div style={{ fontSize: '48px', marginBottom: '16px' }}>📭</div>
                            <p style={{ color: 'var(--text-secondary)' }}>
                                Aucune notification pour le moment
                            </p>
                        </Card>
                    ) : (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                            {invitations.map((notif, index) => (
                                <Card 
                                    key={notif.id}
                                    style={{ 
                                        animationDelay: `${index * 0.05}s`,
                                        borderLeft: notif.type === 'match_result' 
                                            ? '3px solid var(--accent-violet)' 
                                            : '3px solid var(--accent-cyan)'
                                    }}
                                    className="animate-fade-in"
                                >
                                    <div style={{ 
                                        display: 'flex', 
                                        alignItems: 'flex-start', 
                                        gap: '16px',
                                        flexWrap: 'wrap'
                                    }}>
                                        <div style={{
                                            width: '50px',
                                            height: '50px',
                                            background: notif.type === 'match_result' 
                                                ? 'rgba(168,85,247,0.1)' 
                                                : 'rgba(0,240,255,0.1)',
                                            borderRadius: '12px',
                                            display: 'flex',
                                            alignItems: 'center',
                                            justifyContent: 'center',
                                            fontSize: '24px',
                                            flexShrink: 0
                                        }}>
                                            {getNotificationIcon(notif.type)}
                                        </div>
                                        
                                        <div style={{ flex: 1, minWidth: '200px' }}>
                                            {notif.type === 'match_result' ? (
                                                <div style={{ marginBottom: '8px' }}>
                                                    <div style={{ 
                                                        fontWeight: 600, 
                                                        color: 'var(--text-primary)',
                                                        marginBottom: '4px'
                                                    }}>
                                                        🏆 Résultat de match
                                                    </div>
                                                    <div style={{ 
                                                        color: 'var(--accent-violet)',
                                                        fontSize: '14px'
                                                    }}>
                                                        {notif.teamName}
                                                    </div>
                                                </div>
                                            ) : (
                                                <div style={{ marginBottom: '8px' }}>
                                                    <span style={{ 
                                                        fontWeight: 600, 
                                                        color: 'var(--accent-cyan)'
                                                    }}>
                                                        {notif.from}
                                                    </span>
                                                    {' '}{notif.message}
                                                    {notif.teamName && (
                                                        <span style={{ 
                                                            fontWeight: 600, 
                                                            color: 'var(--accent-violet)'
                                                        }}>
                                                            {' '}({notif.teamName})
                                                        </span>
                                                    )}
                                                </div>
                                            )}
                                            <div style={{ 
                                                fontSize: '12px', 
                                                color: 'var(--text-muted)'
                                            }}>
                                                {notif.time}
                                            </div>
                                        </div>
                                        
                                        {notif.type === 'team_invite' && (
                                            <div style={{ 
                                                display: 'flex', 
                                                gap: '8px',
                                                flexShrink: 0
                                        }}>
                                            <Button 
                                                size="sm" 
                                                onClick={() => handleAccept(notif.id)}
                                            >
                                                ✓ Accepter
                                            </Button>
                                            <Button 
                                                size="sm" 
                                                variant="ghost"
                                                onClick={() => handleDecline(notif.id)}
                                            >
                                                ✗ Refuser
                                            </Button>
                                        </div>
                                        )}
                                        
                                        {notif.type === 'match_result' && (
                                            <Button 
                                                size="sm" 
                                                variant="ghost"
                                                onClick={() => handleDismissMatchNotif(notif.id)}
                                            >
                                                ✓ OK
                                            </Button>
                                        )}
                                    </div>
                                </Card>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // Page Messages et Amis
        const MessagesPage = ({ setCurrentPage, setSelectedPlayer }) => {
            const { user } = useAuth();
            const { players, getConversations, getConversation, sendMessage, markMessagesAsRead,
                    getFriends, getPendingRequestsFor, acceptFriendRequest, declineFriendRequest, removeFriend } = useData();
            const [activeTab, setActiveTab] = useState('messages');
            const [selectedConversation, setSelectedConversation] = useState(null);
            const [messageText, setMessageText] = useState('');

            if (!user) {
                return (
                    <div style={{ padding: '40px 24px', maxWidth: '800px', margin: '0 auto' }}>
                        <Card style={{ textAlign: 'center', padding: '60px 24px' }} className="animate-fade-in">
                            <div style={{ fontSize: '48px', marginBottom: '16px' }}>🔒</div>
                            <p style={{ color: 'var(--text-secondary)', marginBottom: '16px' }}>
                                Connecte-toi pour accéder à tes messages
                            </p>
                            <Button onClick={() => setCurrentPage('login')}>
                                Se connecter
                            </Button>
                        </Card>
                    </div>
                );
            }

            const conversations = getConversations(user.discordName);
            const friends = getFriends(user.discordName);
            const friendRequests = getPendingRequestsFor(user.discordName);
            const currentConversation = selectedConversation 
                ? getConversation(user.discordName, selectedConversation) 
                : [];

            const handleSendMessage = () => {
                if (!messageText.trim() || !selectedConversation) return;
                sendMessage(user.discordName, selectedConversation, messageText.trim());
                setMessageText('');
            };

            const handleSelectConversation = (partner) => {
                setSelectedConversation(partner);
                markMessagesAsRead(partner, user.discordName);
            };

            const handlePlayerClick = (playerName) => {
                const player = players.find(p => p.discordName === playerName);
                if (player) {
                    setSelectedPlayer(player);
                    setCurrentPage('player-profile');
                }
            };

            const totalUnread = conversations.reduce((acc, c) => acc + c.unreadCount, 0);

            return (
                <div style={{ padding: '40px 24px', maxWidth: '1000px', margin: '0 auto' }}>
                    <div className="animate-fade-in">
                        <h1 style={{ fontSize: '32px', marginBottom: '8px' }}>
                            💬 Messages & Amis
                        </h1>
                        <p style={{ color: 'var(--text-secondary)', marginBottom: '32px' }}>
                            {friends.length} ami(s) • {totalUnread > 0 ? `${totalUnread} message(s) non lu(s)` : 'Aucun nouveau message'}
                        </p>
                    </div>

                    {/* Tabs */}
                    <div style={{ display: 'flex', gap: '8px', marginBottom: '24px' }} className="animate-fade-in">
                        <button
                            onClick={() => setActiveTab('messages')}
                            style={{
                                padding: '12px 24px',
                                background: activeTab === 'messages' ? 'var(--gradient-main)' : 'var(--bg-card)',
                                border: activeTab === 'messages' ? 'none' : '1px solid var(--border)',
                                borderRadius: '8px',
                                color: activeTab === 'messages' ? 'var(--bg-dark)' : 'var(--text-secondary)',
                                cursor: 'pointer',
                                fontFamily: "'Rajdhani', sans-serif",
                                fontWeight: 600,
                                fontSize: '14px',
                                position: 'relative'
                            }}
                        >
                            💬 Messages
                            {totalUnread > 0 && (
                                <span style={{
                                    position: 'absolute',
                                    top: '-8px',
                                    right: '-8px',
                                    background: 'var(--accent-pink)',
                                    color: 'white',
                                    fontSize: '11px',
                                    fontWeight: 700,
                                    padding: '2px 6px',
                                    borderRadius: '10px',
                                    minWidth: '18px',
                                    textAlign: 'center'
                                }}>
                                    {totalUnread}
                                </span>
                            )}
                        </button>
                        <button
                            onClick={() => setActiveTab('friends')}
                            style={{
                                padding: '12px 24px',
                                background: activeTab === 'friends' ? 'var(--gradient-main)' : 'var(--bg-card)',
                                border: activeTab === 'friends' ? 'none' : '1px solid var(--border)',
                                borderRadius: '8px',
                                color: activeTab === 'friends' ? 'var(--bg-dark)' : 'var(--text-secondary)',
                                cursor: 'pointer',
                                fontFamily: "'Rajdhani', sans-serif",
                                fontWeight: 600,
                                fontSize: '14px'
                            }}
                        >
                            👥 Amis ({friends.length})
                        </button>
                        <button
                            onClick={() => setActiveTab('requests')}
                            style={{
                                padding: '12px 24px',
                                background: activeTab === 'requests' ? 'var(--gradient-main)' : 'var(--bg-card)',
                                border: activeTab === 'requests' ? 'none' : '1px solid var(--border)',
                                borderRadius: '8px',
                                color: activeTab === 'requests' ? 'var(--bg-dark)' : 'var(--text-secondary)',
                                cursor: 'pointer',
                                fontFamily: "'Rajdhani', sans-serif",
                                fontWeight: 600,
                                fontSize: '14px',
                                position: 'relative'
                            }}
                        >
                            📨 Demandes
                            {friendRequests.length > 0 && (
                                <span style={{
                                    position: 'absolute',
                                    top: '-8px',
                                    right: '-8px',
                                    background: 'var(--accent-cyan)',
                                    color: 'var(--bg-dark)',
                                    fontSize: '11px',
                                    fontWeight: 700,
                                    padding: '2px 6px',
                                    borderRadius: '10px',
                                    minWidth: '18px',
                                    textAlign: 'center'
                                }}>
                                    {friendRequests.length}
                                </span>
                            )}
                        </button>
                    </div>

        const PlanningPage = () => {
            const { settings } = useData();
            const planning = settings.gamePlanning || INITIAL_SETTINGS.gamePlanning;

            const getGameStatus = (gameSchedule) => {
                if (!gameSchedule.startDate || !gameSchedule.endDate) return 'not-scheduled';
                
                const now = new Date();
                const start = new Date(gameSchedule.startDate);
                const end = new Date(gameSchedule.endDate);

                if (now < start) return 'upcoming';
                if (now > end) return 'finished';
                return 'active';
            };

            const formatDate = (dateStr) => {
                if (!dateStr) return '—';
                return new Date(dateStr).toLocaleDateString('fr-FR', {
                    day: 'numeric',
                    month: 'short'
                });
            };

            const StatusBadge = ({ status }) => {
                const styles = {
                    'active': { bg: 'rgba(34,197,94,0.2)', color: '#22c55e', text: '🔥 EN COURS' },
                    'upcoming': { bg: 'rgba(0,240,255,0.2)', color: 'var(--accent-cyan)', text: '📅 À VENIR' },
                    'finished': { bg: 'rgba(100,100,100,0.2)', color: '#888', text: '✅ TERMINÉ' },
                    'not-scheduled': { bg: 'rgba(100,100,100,0.1)', color: '#666', text: '⏳ Non planifié' }

                        padding: '4px 12px',
                        borderRadius: '50px',
                        fontSize: '11px',
                        fontWeight: 700,
                        background: style.bg,
                        color: style.color,

                        {style.text}

                );
            };

            return (

            const { user } = useAuth();

            const [activeTab, setActiveTab] = useState('history');

            const [newMatch, setNewMatch] = useState({
                team1Id: '',
                team2Id: '',
                gameId: '',
                winner: ''
            });
            const [matchDeclared, setMatchDeclared] = useState(false);

            const handlePlayerClick = (playerName) => {
                const player = players.find(p => p.discordName === playerName);
                if (player) {
                    setSelectedPlayer(player);
                    setCurrentPage('player-profile');
                }
            };

            // Trouver l'équipe de l'utilisateur et vérifier s'il est chef
            const userTeam = user ? teams.find(t => t.players.includes(user.discordName)) : null;
            const isTeamLeader = userTeam && userTeam.players[0] === user?.discordName;

            const getTeamName = (id) => teams.find(t => t.id === id)?.name || 'Équipe inconnue';
            const getGameEmoji = (id) => GAMES.find(g => g.id === id)?.emoji || '🎮';
            const getGameColor = (id) => GAMES.find(g => g.id === id)?.color || '#888';

            const handleDeclareMatch = async () => {
                if (!newMatch.team2Id || !newMatch.gameId || !newMatch.winner) {
                    alert('Remplis tous les champs');
                    return;
                }
                
                const team1 = userTeam;
                const team2 = teams.find(t => t.id === newMatch.team2Id);
                const game = GAMES.find(g => g.id === newMatch.gameId);
                
                // Déterminer les points
                let team1Points = 0;
                let team2Points = 0;
                
                if (newMatch.winner === 'team1') {
                    team1Points = POINTS_SYSTEM.win;
                    team2Points = POINTS_SYSTEM.lose;
                } else if (newMatch.winner === 'team2') {
                    team1Points = POINTS_SYSTEM.lose;
                    team2Points = POINTS_SYSTEM.win;
                } else {
                    team1Points = POINTS_SYSTEM.draw;
                    team2Points = POINTS_SYSTEM.draw;
                }
                
                // Ajouter le match
                addMatch({
                    ...newMatch,
                    team1Id: userTeam.id,
                    declaredBy: user.discordName
                });
                
                // Mettre à jour les points des équipes dans Supabase
                if (supabase && team1 && team2) {
                    // Team 1
                    const newTeam1Points = { ...(team1.points || {}) };
                    newTeam1Points[newMatch.gameId] = (newTeam1Points[newMatch.gameId] || 0) + team1Points;
                    await supabase.from('teams').update({ points: newTeam1Points }).eq('id', team1.id);
                    
                    // Team 2
                    const newTeam2Points = { ...(team2.points || {}) };
                    newTeam2Points[newMatch.gameId] = (newTeam2Points[newMatch.gameId] || 0) + team2Points;
                    await supabase.from('teams').update({ points: newTeam2Points }).eq('id', team2.id);
                    
                    // Envoyer notification à l'équipe adverse
                    const winnerText = newMatch.winner === 'team1' ? 
                        `${team1.name} a gagné` : 
                        (newMatch.winner === 'team2' ? `${team2.name} a gagné` : 'Match nul');
                    
                    // Notification pour l'équipe 2
                    for (const playerName of team2.players) {
                        await supabase.from('team_invitations').insert({
                            from_player: 'SYSTÈME',
                            to_player: playerName,
                            team_name: `${game?.emoji || '🎮'} ${game?.name || 'Match'}: ${winnerText} | ${team2.name}: ${team2Points > 0 ? '+' : ''}${team2Points} pts`,
                            status: 'match_result'
                        });
                    }
                    
                    // Notification pour l'équipe 1 aussi (sauf le déclarant)
                    for (const playerName of team1.players) {
                        if (playerName !== user.discordName) {
                            await supabase.from('team_invitations').insert({

        // ============================================
        // APP PRINCIPALE
        // ============================================

        // Composant SplashScreen avec explosion cyberpunk
        const SplashScreen = ({ onEnter }) => {
            const [exploding, setExploding] = useState(false);
            const [particles, setParticles] = useState([]);

            const handleClick = () => {
                if (exploding) return;
                setExploding(true);
                
                // Créer des particules pour l'explosion
                const newParticles = [];
                for (let i = 0; i < 60; i++) {
                    const angle = (Math.PI * 2 * i) / 60 + Math.random() * 0.5;
                    const velocity = 8 + Math.random() * 15;
                    const size = 4 + Math.random() * 12;
                    const isCyan = Math.random() > 0.5;
                    newParticles.push({
                        id: i,
                        x: 0,
                        y: 0,
                        vx: Math.cos(angle) * velocity,
                        vy: Math.sin(angle) * velocity,
                        size,
                        color: isCyan ? '#00f0ff' : '#a855f7',
                        opacity: 1,
                        rotation: Math.random() * 360,
                        type: Math.random() > 0.7 ? 'square' : 'circle'
                    });
                }
                // Ajouter des lignes de glitch
                for (let i = 0; i < 20; i++) {
                    newParticles.push({
                        id: 60 + i,
                        x: 0,
                        y: 0,
                        vx: (Math.random() - 0.5) * 30,
                        vy: (Math.random() - 0.5) * 30,
                        size: 2 + Math.random() * 3,
                        width: 50 + Math.random() * 100,
                        color: Math.random() > 0.5 ? '#00f0ff' : '#ff00ff',
                        opacity: 1,
                        rotation: Math.random() * 360,
                        type: 'line'
                    });
                }
                setParticles(newParticles);

                // Transition vers l'accueil après l'animation
                setTimeout(() => {
                    onEnter();
                }, 1200);
            };

            // Animation des particules
            useEffect(() => {
                if (!exploding || particles.length === 0) return;

                const interval = setInterval(() => {
                    setParticles(prev => prev.map(p => ({
                        ...p,
                        x: p.x + p.vx,
                        y: p.y + p.vy,
                        vx: p.vx * 0.96,
                        vy: p.vy * 0.96,
                        opacity: p.opacity * 0.92,
                        rotation: p.rotation + (p.type === 'square' ? 15 : 0)
                    })).filter(p => p.opacity > 0.05));
                }, 16);

                return () => clearInterval(interval);
            }, [exploding, particles.length]);

            return (
                <div style={{
                    position: 'fixed',
                    top: 0,
                    left: 0,
                    width: '100vw',
                    height: '100vh',
                    background: 'var(--bg-dark)',
                    display: 'flex',
                    flexDirection: 'column',
                    alignItems: 'center',
                    justifyContent: 'center',
                    zIndex: 9999,
                    overflow: 'hidden',
                    opacity: exploding ? 0 : 1,
                    transition: 'opacity 0.5s ease-out',
                    transitionDelay: '0.7s'
                }}>
                    {/* Fond animé avec grid cyberpunk */}
                    <div style={{
                        position: 'absolute',
                        top: 0,
                        left: 0,
                        right: 0,
                        bottom: 0,
                        background: `
                            linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px),
                            linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px)
                        `,
                        backgroundSize: '50px 50px',
                        animation: 'gridMove 20s linear infinite'
                    }} />

                    {/* Cercles de glow en arrière-plan */}
                    <div style={{
                        position: 'absolute',
                        width: '600px',
                        height: '600px',
                        borderRadius: '50%',
                        background: 'radial-gradient(circle, rgba(0,240,255,0.15) 0%, transparent 70%)',
                        animation: 'pulse 3s ease-in-out infinite'
                    }} />
                    <div style={{
                        position: 'absolute',
                        width: '400px',
                        height: '400px',
                        borderRadius: '50%',
                        background: 'radial-gradient(circle, rgba(168,85,247,0.2) 0%, transparent 70%)',
                        animation: 'pulse 3s ease-in-out infinite 0.5s'
                    }} />

                    {/* Container du logo cliquable */}
                    <div 
                        onClick={handleClick}
                        style={{
                            position: 'relative',
                            cursor: 'pointer',
                            transform: exploding ? 'scale(1.5)' : 'scale(1)',
                            transition: 'transform 0.3s ease-out',
                            zIndex: 10
                        }}
                    >
                        {/* Logo */}
                        <img 
                            src="logo-after-ligue.svg" 
                            alt="After Ligue" 
                            style={{
                                width: '280px',
                                height: 'auto',
                                filter: `drop-shadow(0 0 30px rgba(0,240,255,0.6)) drop-shadow(0 0 60px rgba(168,85,247,0.4))`,
                                animation: exploding ? 'none' : 'float 3s ease-in-out infinite',
                                opacity: exploding ? 0 : 1,
                                transition: 'opacity 0.2s ease-out'
                            }}
                        />

                        {/* Particules d'explosion */}
                        {particles.map(p => (
                            <div
                                key={p.id}
                                style={{
                                    position: 'absolute',
                                    left: '50%',
                                    top: '50%',
                                    transform: `translate(${p.x}px, ${p.y}px) rotate(${p.rotation}deg)`,
                                    opacity: p.opacity,
                                    pointerEvents: 'none'
                                }}
                            >
                                {p.type === 'circle' && (
                                    <div style={{
                                        width: p.size,
                                        height: p.size,
                                        borderRadius: '50%',
                                        background: p.color,
                                        boxShadow: `0 0 ${p.size * 2}px ${p.color}`
                                    }} />
                                )}
                                {p.type === 'square' && (
                                    <div style={{
                                        width: p.size,
                                        height: p.size,
                                        background: p.color,
                                        boxShadow: `0 0 ${p.size}px ${p.color}`
                                    }} />
                                )}
                                {p.type === 'line' && (
                                    <div style={{
                                        width: p.width,
                                        height: p.size,
                                        background: `linear-gradient(90deg, transparent, ${p.color}, transparent)`,
                                        boxShadow: `0 0 10px ${p.color}`
                                    }} />
                                )}
                            </div>
                        ))}

                        {/* Onde de choc */}
                        {exploding && (
                            <>
                                <div style={{
                                    position: 'absolute',
                                    left: '50%',
                                    top: '50%',
                                    transform: 'translate(-50%, -50%)',
                                    width: '10px',
                                    height: '10px',
                                    borderRadius: '50%',
                                    border: '3px solid #00f0ff',
                                    animation: 'shockwave 0.8s ease-out forwards'
                                }} />
                                <div style={{
                                    position: 'absolute',
                                    left: '50%',
                                    top: '50%',
                                    transform: 'translate(-50%, -50%)',
                                    width: '10px',
                                    height: '10px',
                                    borderRadius: '50%',
                                    border: '3px solid #a855f7',
                                    animation: 'shockwave 0.8s ease-out forwards 0.1s'
                                }} />
                            </>
                        )}
                    </div>

                    {/* Texte d'instruction */}
                    <div style={{
                        marginTop: '40px',
                        fontFamily: "'Rajdhani', sans-serif",
                        fontSize: '18px',
                        color: 'var(--text-muted)',
                        animation: 'blink 2s ease-in-out infinite',
                        opacity: exploding ? 0 : 1,
                        transition: 'opacity 0.2s ease-out',
                        textTransform: 'uppercase',
                        letterSpacing: '0.3em'
                    }}>
                        Clique pour entrer
                    </div>

                    {/* Flash blanc lors de l'explosion */}
                    {exploding && (
                        <div style={{
                            position: 'absolute',
                            top: 0,
                            left: 0,
                            right: 0,
                            bottom: 0,
                            background: 'white',
                            animation: 'flash 0.5s ease-out forwards',
                            pointerEvents: 'none'
                        }} />
                    )}

                    {/* Styles d'animation */}
                    <style>{`
                        @keyframes float {
                            0%, 100% { transform: translateY(0); }
                            50% { transform: translateY(-15px); }
                        }
                        @keyframes pulse {
                            0%, 100% { transform: scale(1); opacity: 0.5; }
                            50% { transform: scale(1.1); opacity: 0.8; }
                        }
                        @keyframes blink {
                            0%, 100% { opacity: 0.4; }
                            50% { opacity: 1; }
                        }
                        @keyframes shockwave {
                            0% { width: 10px; height: 10px; opacity: 1; }
                            100% { width: 800px; height: 800px; opacity: 0; }
                        }
                        @keyframes flash {
                            0% { opacity: 0; }
                            20% { opacity: 0.8; }
                            100% { opacity: 0; }
                        }
                        @keyframes gridMove {
                            0% { transform: translate(0, 0); }
                            100% { transform: translate(50px, 50px); }
                        }
                    `}</style>
                </div>
            );
        };

        const App = () => {
            const [showSplash, setShowSplash] = useState(true); // Toujours afficher le splash
            const [currentPage, setCurrentPage] = useState('home');
            const [user, setUser] = useState(null);
            const [selectedPlayer, setSelectedPlayer] = useState(null);

            const handleEnterSite = () => {
                setShowSplash(false);
            };

            const login = async (userData) => {
                const newUser = {
                    ...userData,
                    status: 'solo',
                    partner: '',
                    availability: '',
                    levels: GAMES.reduce((acc, game) => ({ ...acc, [game.id]: 0 }), {}),
                    isAdmin: false
                };
                
                // Sauvegarder dans Supabase
                if (supabase) {
                    try {
                        // Vérifier si le joueur existe déjà
                        const { data: existingPlayer } = await supabase
                            .from('players')
                            .select('*')
                            .eq('discord_name', userData.discordName)
                            .single();
                        
                        if (existingPlayer) {
                            // Joueur existe déjà, récupérer ses données
                            newUser.id = existingPlayer.id;
                            newUser.status = existingPlayer.status || 'solo';
                            newUser.partner = existingPlayer.partner || '';
                            newUser.availability = existingPlayer.availability || '';
                            newUser.levels = existingPlayer.levels || {};
                            newUser.profileImage = existingPlayer.avatar_url || existingPlayer.profile_image || null;
                            console.log('✅ Joueur existant récupéré:', userData.discordName);
                        } else {
                            // Nouveau joueur, l'ajouter
                            const { data, error } = await supabase.from('players').insert({
                                discord_name: userData.discordName,
                                discord_id: userData.discordId || null,
                                avatar_url: userData.avatar || null,
                                status: 'solo',
                                partner: null,
                                availability: '',
                                levels: GAMES.reduce((acc, game) => ({ ...acc, [game.id]: 0 }), {})
                            }).select().single();
                            
                            if (data) {
                                newUser.id = data.id;
                                console.log('✅ Nouveau joueur créé:', userData.discordName);
                            }
                            if (error) {
                                console.error('Erreur création joueur:', error);
                            }
                        }
                    } catch (error) {
                        console.error('Erreur Supabase login:', error);
                    }
                }
                
                setUser(newUser);
                Storage.set('currentUser', userData);
            };

            const logout = () => {
                setUser(null);
                setCurrentPage('home');
                Storage.remove('currentUser');
            };

            const updateUser = async (updates) => {
                const newUserData = { ...user, ...updates };
                setUser(newUserData);
                
                // Sauvegarder dans Supabase
                if (supabase && user?.discordName) {
                    try {
                        await supabase.from('players').update({
                            status: newUserData.status,
                            partner: newUserData.partner,
                            availability: newUserData.availability,
                            levels: newUserData.levels,
                            avatar_url: newUserData.profileImage
                        }).eq('discord_name', user.discordName);
                        console.log('✅ Profil sauvegardé dans Supabase');
                    } catch (error) {
                        console.error('Erreur sauvegarde profil:', error);
                    }
                }
            };

            // Récupérer l'utilisateur au chargement
            useEffect(() => {
                const loadUser = async () => {
                    const savedUser = Storage.get('currentUser', null);
                    if (savedUser) {
                        // Recharger depuis Supabase si disponible
                        if (supabase) {
                            const { data } = await supabase
                                .from('players')
                                .select('*')
                                .eq('discord_name', savedUser.discordName)
                                .single();
                            
                            if (data) {
                                setUser({
                                    ...savedUser,
                                    id: data.id,
                                    status: data.status || 'solo',
                                    partner: data.partner || '',
                                    availability: data.availability || '',
                                    levels: data.levels || GAMES.reduce((acc, game) => ({ ...acc, [game.id]: 0 }), {}),
                                    profileImage: data.avatar_url || data.profile_image || null
                                });
                                return;
                            }
                        }
                        
                        setUser({
                            ...savedUser,
                            status: 'solo',
                            partner: '',
                            availability: '',
                            levels: GAMES.reduce((acc, game) => ({ ...acc, [game.id]: 0 }), {})
                        });
                    }
                };
                loadUser();
            }, []);

            const authValue = { user, login, logout, updateUser };

            const renderPage = () => {
                switch (currentPage) {
                    case 'home':
                        return <HomePage setCurrentPage={setCurrentPage} />;
                    case 'login':
                        return <LoginPage setCurrentPage={setCurrentPage} />;
                    case 'profile':
                        return user ? <ProfilePage setCurrentPage={setCurrentPage} /> : <LoginPage setCurrentPage={setCurrentPage} />;
                    case 'notifications':
                        return user ? <NotificationsPage setCurrentPage={setCurrentPage} /> : <LoginPage setCurrentPage={setCurrentPage} />;
                    case 'messages':
                        return user ? <MessagesPage setCurrentPage={setCurrentPage} setSelectedPlayer={setSelectedPlayer} /> : <LoginPage setCurrentPage={setCurrentPage} />;
                    case 'teams':
                        return <TeamsPage setCurrentPage={setCurrentPage} setSelectedPlayer={setSelectedPlayer} />;
                    case 'matches':
                        return <MatchesPage setCurrentPage={setCurrentPage} setSelectedPlayer={setSelectedPlayer} />;
                    case 'rankings':
                        return <RankingsPage setCurrentPage={setCurrentPage} setSelectedPlayer={setSelectedPlayer} />;
                    case 'planning':
                        return <PlanningPage />;
                    case 'finale':
                        return <FinalePage />;
                    case 'rules':
                        return <RulesPage setCurrentPage={setCurrentPage} />;
                    case 'admin':
                        return <AdminPage setCurrentPage={setCurrentPage} />;
                    case 'player-profile':
                        return <PlayerProfilePage player={selectedPlayer} setCurrentPage={setCurrentPage} />;
                    default:
                        return <HomePage setCurrentPage={setCurrentPage} />;
                }
            };

            // Afficher le splash screen
            if (showSplash) {
                return <SplashScreen onEnter={handleEnterSite} />;
            }

            return (
                <AuthContext.Provider value={authValue}>
                    <DataProvider>
                        <Header currentPage={currentPage} setCurrentPage={setCurrentPage} />
                        <main style={{ flex: 1 }}>
                            {renderPage()}
                        </main>
                        
                        {/* Navigation Mobile Bottom Bar */}
                        <nav className="mobile-nav">
                            <div style={{
                                display: 'flex',
                                justifyContent: 'space-around',
                                alignItems: 'center',
                                maxWidth: '500px',
                                margin: '0 auto'
                            }}>
                                {[
                                    { id: 'home', icon: '🏠', label: 'Accueil' },
                                    { id: 'teams', icon: '👥', label: 'Équipes' },
                                    { id: 'rankings', icon: '🏆', label: 'Classement' },
                                    { id: 'matches', icon: '⚔️', label: 'Matchs' },
                                    { id: user ? 'profile' : 'login', icon: user ? '👤' : '🔑', label: user ? 'Profil' : 'Connexion' }
                                ].map(item => (
                                    <button
                                        key={item.id}
                                        onClick={() => setCurrentPage(item.id)}
                                        style={{
                                            background: 'none',
                                            border: 'none',
                                            display: 'flex',
                                            flexDirection: 'column',
                                            alignItems: 'center',
                                            gap: '4px',
                                            padding: '8px 12px',
                                            cursor: 'pointer',
                                            color: currentPage === item.id ? 'var(--accent-cyan)' : 'var(--text-muted)',
                                            transition: 'all 0.2s ease'
                                        }}
                                    >
                                        <span style={{ 
                                            fontSize: '22px',
                                            filter: currentPage === item.id ? 'drop-shadow(0 0 8px var(--accent-cyan))' : 'none'
                                        }}>
                                            {item.icon}
                                        </span>
                                        <span style={{ 
                                            fontSize: '10px', 
                                            fontWeight: 600,
                                            fontFamily: "'Rajdhani', sans-serif"
                                        }}>
                                            {item.label}
                                        </span>
                                    </button>
                                ))}
                            </div>
                        </nav>
                        
                        <footer style={{
                            borderTop: '1px solid var(--border)',
                            padding: '24px',
                            textAlign: 'center',
                            color: 'var(--text-muted)',
                            fontSize: '13px'
                        }}>
                            <div style={{ marginBottom: '8px' }}>
                                <span style={{
                                    fontFamily: "'Orbitron', monospace",
                                    fontWeight: 600,
                                    background: 'var(--gradient-main)',
                                    WebkitBackgroundClip: 'text',
                                    WebkitTextFillColor: 'transparent'
                                }}>
                                    AFTER LIGUE
                                </span>
                                {' '}— Ligue multi-jeux 2v2 fun
                            </div>
                            <div>
                                Made with 💜 • Version MVP
                            </div>
                        </footer>
                    </DataProvider>
                </AuthContext.Provider>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
